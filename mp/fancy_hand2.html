<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gesture Music Player - Stable Lite MP3 Update</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/addons/p5.sound.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #08111f;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
    }
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #08111f;
      z-index: 99;
      color: #7ff;
    }
    button {
      margin-top: 18px;
      padding: 12px 22px;
      border: 1px solid #7ff;
      background: transparent;
      color: #7ff;
      font-size: 18px;
      cursor: pointer;
    }
    #log {
      position: fixed;
      left: 12px;
      bottom: 10px;
      color: rgba(255,255,255,0.75);
      font-size: 14px;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <div style="font-size: 28px; letter-spacing: 2px;">Gesture Music Player</div>
    <div id="loading" style="margin-top:10px; font-size:14px;">Loading AI model...</div>
    <button id="startBtn" onclick="initSystem()" style="display:none;">開始</button>
  </div>
  <div id="log">SYSTEM IDLE</div>

<script>
let video, handPose, hands = [];
let ready = false;

let uiOsc, uiEnv;
let roarSound = null;
let roarLoaded = false;
let waltzSound = null;
let waltzLoaded = false;
let interludeSound = null;
let interludeLoaded = false;
let totoroThemeSound = null;
let totoroThemeLoaded = false;
let activeOscillators = [];
let timers = [];

let fallbackImg = null;
let artworks = {};

let selectedTrackKey = '1';
let playingTrackKey = null;
let playerState = 'stopped';
let currentSongTitle = 'No music playing';
let currentTrackDurationMs = 1;
let trackStartMs = 0;
let pauseElapsedMs = 0;
let audioPauseTime = 0;
let currentSongColor = [0, 255, 255];

let selectionCandidate = '';
let selectionStableFrames = 0;
let lastSelectionTriggerFrame = -999;
let controlCandidate = '';
let controlStableFrames = 0;
let lastControlTriggerFrame = -999;
let detectedCount = 0;

const SELECTION_STABLE_FRAMES = 14;
const CONTROL_STABLE_FRAMES = 14;
const SELECTION_COOLDOWN_FRAMES = 40;
const CONTROL_COOLDOWN_FRAMES = 40;

const NOTES = {
  C2: 65.41, D2: 73.42, E2: 82.41, F2: 87.31, G2: 98.00, A2: 110.00, B2: 123.47,
  C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.00, A3: 220.00, B3: 246.94,
  C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
  C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00, B5: 987.77,
  C6: 1046.50
};

function N(n, d) { return { n, d }; }
function C(chord, d) { return { chord, d }; }
function seq(...items) { return items; }
function cloneSeq(s) { return s.map(step => ({...step, chord: step.chord ? [...step.chord] : undefined})); }
function rep(s, times) { let out = []; for (let i = 0; i < times; i++) out = out.concat(cloneSeq(s)); return out; }

const trackArtFiles = {
  '1': 'cover_1_mozart.png',
  '2': 'cover_2_furelise.png',
  '3': 'cover_3_totoro.png',
  '4': 'cover_4_spring.png',
  '5': 'cover_5_canon.png',
  '6': 'cover_6_roar.png'
};

const tracks = buildTracks();

function buildTracks() {
  const mozMelody = rep(seq(N('G4',220), N('D4',220), N('G4',220), N('B4',220), N('D5',440), N('B4',220), N('G4',440), N('E5',220), N('C5',220), N('E5',220), N('G5',220), N('D5',660)), 4);
  const mozBass = rep(seq(N('G3',440), N('D3',440), N('C3',440), N('D3',440), N('G2',880)), 5);

  const furMelody = rep(seq(N('E5',160), N('D5',160), N('E5',160), N('D5',160), N('E5',160), N('B4',160), N('D5',160), N('C5',160), N('A4',420), N('C4',160), N('E4',160), N('A4',160), N('B4',420)), 4);
  const furBass = rep(seq(N('A2',640), N('E3',640), N('A2',880)), 6);

  const totoMelody = rep(seq(N('G4',220), N('B4',220), N('D5',220), N('G5',380), N('E5',180), N('D5',220), N('B4',220), N('A4',220), N('B4',220), N('D5',440)), 5);
  const totoBass = rep(seq(N('G3',440), N('D3',440), N('C3',440), N('D3',440), N('G2',880)), 5);

  return {
    '1': {
      key: '1', title: '1 - Mozart / Eine kleine Nachtmusik', shortTitle: 'MOZART', instrument: 'violin', color: [255, 90, 140], tempo: 1.0, melody: mozMelody, bass: mozBass
    },
    '2': {
      key: '2', title: '2 - Beethoven / Fur Elise', shortTitle: 'FUR ELISE', instrument: 'piano', color: [120, 220, 255], tempo: 1.0, melody: furMelody, bass: furBass
    },
    '3': {
      key: '3', title: '3 - My Neighbor Totoro Theme.mp3', shortTitle: 'TOTORO MP3', instrument: 'mp3_totoro', color: [150, 255, 190], file: 'My Neighbor Totoro Theme.mp3'
    },
    '4': {
      key: '4', title: '4 - Waltz in A-flat major.mp3', shortTitle: 'WALTZ MP3', instrument: 'mp3_waltz', color: [150, 255, 160], file: 'Waltz in A-flat major.mp3'
    },
    '5': {
      key: '5', title: "5 - Interlude Lonesome George's Dream.mp3", shortTitle: 'INTERLUDE MP3', instrument: 'mp3_interlude', color: [220, 160, 255], file: "Interlude Lonesome George's Dream.mp3"
    },
    '6': {
      key: '6', title: '6 - Katy Perry / Roar.mp3', shortTitle: 'ROAR MP3', instrument: 'mp3_roar', color: [255, 120, 80], file: 'Katy Perry - Roar.mp3'
    }
  };
}

function setup() {
  createCanvas(windowWidth, windowHeight);
  angleMode(DEGREES);
  uiOsc = new p5.Oscillator('sine');
  uiEnv = new p5.Envelope();
  uiEnv.setADSR(0.001, 0.05, 0.1, 0.1);
  uiEnv.setRange(0.4, 0);

  fallbackImg = loadImage('totoro_cutout.png', ()=>{}, ()=>{});
  for (const key in trackArtFiles) {
    artworks[key] = null;
    loadImage(trackArtFiles[key], img => artworks[key] = img, () => artworks[key] = null);
  }

  handPose = ml5.handPose({ flipped: true, maxHands: 2 }, () => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('startBtn').style.display = 'block';
    setLog('MODEL READY');
  });
}

function initSystem() {
  userStartAudio();
  loadAllMp3();
  playUITone(880);
  video = createCapture(VIDEO, () => {
    document.getElementById('overlay').style.display = 'none';
    handPose.detectStart(video, results => { hands = results; });
    ready = true;
  });
  video.size(640, 480);
  video.hide();
}

function setLog(msg) {
  document.getElementById('log').innerText = msg;
}

function loadAllMp3() {
  roarSound = loadSound('Katy Perry - Roar.mp3', () => {
    roarLoaded = true;
    setLog('ROAR READY');
  }, () => {
    roarLoaded = false;
    setLog('ROAR MP3 NOT FOUND');
  });

  waltzSound = loadSound('Waltz in A-flat major.mp3', () => {
    waltzLoaded = true;
    setLog('WALTZ READY');
  }, () => {
    waltzLoaded = false;
    setLog('WALTZ MP3 NOT FOUND');
  });

  interludeSound = loadSound("Interlude Lonesome George's Dream.mp3", () => {
    interludeLoaded = true;
    setLog('INTERLUDE READY');
  }, () => {
    interludeLoaded = false;
    setLog('INTERLUDE MP3 NOT FOUND');
  });

  totoroThemeSound = loadSound('My Neighbor Totoro Theme.mp3', () => {
    totoroThemeLoaded = true;
    setLog('TOTORO THEME READY');
  }, () => {
    totoroThemeLoaded = false;
    setLog('TOTORO THEME MP3 NOT FOUND');
  });
}

function playUITone(freq) {
  uiOsc.freq(freq);
  uiOsc.start();
  uiEnv.play(uiOsc);
}

function draw() {
  background(8, 17, 31);
  if (!ready) return;

  if (video) {
    push();
    translate(width, 0);
    scale(-1, 1);
    tint(80, 140, 255, 22);
    image(video, 0, 0, width, height);
    noTint();
    pop();
  }

  drawPlayerCard();

  if (hands && hands.length > 0) {
    detectedCount = hands.map(countExtendedFingers).reduce((a,b) => a + b, 0);
    hands.forEach(drawHandSimple);

    const control = detectControlGesture(hands);
    updateControlGesture(control);

    if (!control) {
      const selection = detectSelectionGesture(hands);
      updateSelectionGesture(selection);
    } else {
      updateSelectionGesture('');
    }
  } else {
    updateSelectionGesture('');
    updateControlGesture('');
  }

  drawTopText();
  drawBottomGuide();
}

function drawPlayerCard() {
  const track = tracks[selectedTrackKey];
  const art = artworks[selectedTrackKey] || fallbackImg;
  const c = currentSongColor;
  const cardW = min(520, width * 0.42);
  const cardH = min(690, height * 0.74);
  const x = width / 2 - cardW / 2;
  const y = 60;
  const artSize = min(cardW - 64, cardH * 0.55);
  const artX = x + cardW / 2 - artSize / 2;
  const artY = y + 36;

  noStroke();
  fill(0,0,0,120);
  rect(x + 12, y + 14, cardW, cardH, 24);

  stroke(c[0], c[1], c[2], 180);
  strokeWeight(2);
  fill(11, 22, 40, 228);
  rect(x, y, cardW, cardH, 24);

  fill(0,0,0,110);
  noStroke();
  rect(artX + 8, artY + 10, artSize, artSize, 22);

  stroke(c[0], c[1], c[2], 200);
  fill(18, 28, 45);
  rect(artX, artY, artSize, artSize, 22);

  if (art) image(art, artX + 8, artY + 8, artSize - 16, artSize - 16);

  fill(c[0], c[1], c[2]);
  noStroke();
  textAlign(CENTER, CENTER);
  textSize(24);
  text(track.shortTitle, x + cardW / 2, artY + artSize + 56);
  fill(220);
  textSize(12);
  text(track.title, x + cardW / 2, artY + artSize + 82);

  const barX = x + 42;
  const barY = artY + artSize + 132;
  const barW = cardW - 84;
  const progress = getProgressRatio();

  fill(255,255,255,38);
  noStroke();
  rect(barX, barY, barW, 10, 8);
  fill(c[0], c[1], c[2], 220);
  rect(barX, barY, barW * progress, 10, 8);

  fill(255, 180);
  textAlign(LEFT, CENTER);
  textSize(10);
  const elapsed = playerState === 'paused' ? pauseElapsedMs : max(0, millis() - trackStartMs);
  text(formatTime(elapsed), barX, barY + 24);
  textAlign(RIGHT, CENTER);
  text(formatTime(currentTrackDurationMs), barX + barW, barY + 24);

  drawStateBadge(x + cardW / 2, barY + 58, c);
}

function drawStateBadge(cx, cy, c) {
  const label = playerState.toUpperCase();
  const icon = playerState === 'playing' ? '▶' : playerState === 'paused' ? 'Ⅱ' : '■';
  rectMode(CENTER);
  stroke(c[0], c[1], c[2], 180);
  fill(c[0], c[1], c[2], 48);
  rect(cx, cy, 170, 34, 18);
  fill(255);
  noStroke();
  textAlign(CENTER, CENTER);
  textSize(12);
  text(`${icon} ${label}`, cx, cy);
  rectMode(CORNER);
}

function getProgressRatio() {
  if (playerState === 'stopped') return 0;
  const elapsed = playerState === 'paused' ? pauseElapsedMs : max(0, millis() - trackStartMs);
  return constrain(elapsed / max(currentTrackDurationMs, 1), 0, 1);
}

function formatTime(ms) {
  ms = max(0, ms || 0);
  const totalSec = floor(ms / 1000);
  const m = floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${nf(s, 2)}`;
}

function drawHandSimple(hand) {
  const pts = hand.keypoints;
  stroke(0,255,255,110);
  strokeWeight(2);
  const connections = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
  connections.forEach(([a,b]) => {
    line(map(pts[a].x,0,640,0,width), map(pts[a].y,0,480,0,height), map(pts[b].x,0,640,0,width), map(pts[b].y,0,480,0,height));
  });
}

function countExtendedFingers(hand) {
  const kp = hand.keypoints;
  const palm = kp[9];
  let count = 0;
  const thumbOpen = dist(kp[4].x, kp[4].y, palm.x, palm.y) > dist(kp[3].x, kp[3].y, palm.x, palm.y) + 18;
  if (thumbOpen) count++;
  if (kp[8].y < kp[6].y - 10) count++;
  if (kp[12].y < kp[10].y - 10) count++;
  if (kp[16].y < kp[14].y - 10) count++;
  if (kp[20].y < kp[18].y - 10) count++;
  return constrain(count, 0, 5);
}

function detectSelectionGesture(activeHands) {
  const total = activeHands.map(countExtendedFingers).reduce((a,b)=>a+b,0);
  if (total >= 1 && total <= 6) return String(total);
  return '';
}

function updateSelectionGesture(selection) {
  if (selection === selectionCandidate) selectionStableFrames++;
  else {
    selectionCandidate = selection;
    selectionStableFrames = 0;
  }

  const stable = selectionStableFrames > SELECTION_STABLE_FRAMES;
  const cooled = frameCount - lastSelectionTriggerFrame > SELECTION_COOLDOWN_FRAMES;

  if (selection && stable && cooled && tracks[selection]) {
    selectedTrackKey = selection;
    currentSongColor = tracks[selection].color;
    lastSelectionTriggerFrame = frameCount;
    playUITone(1100);
    setLog(`SELECTED ${tracks[selection].shortTitle}`);
  }
}

function thumbAndIndexTouching(hand) {
  const kp = hand.keypoints;
  const wrist = kp[0];
  const palm = kp[9];
  const handScale = dist(wrist.x, wrist.y, palm.x, palm.y);
  return dist(kp[4].x, kp[4].y, kp[8].x, kp[8].y) < max(22, handScale * 0.42);
}

function isFingerExtended(hand, tipIdx, pipIdx) {
  const kp = hand.keypoints;
  return kp[tipIdx].y < kp[pipIdx].y - 10;
}

function isOKPlayGesture(hand) {
  if (!thumbAndIndexTouching(hand)) return false;
  return isFingerExtended(hand, 12, 10) && isFingerExtended(hand, 16, 14) && isFingerExtended(hand, 20, 18);
}

function detectControlGesture(activeHands) {
  const counts = activeHands.map(countExtendedFingers);
  if (activeHands.length >= 2 && counts[0] === 0 && counts[1] === 0) return 'STOP';
  if (activeHands.length === 1 && counts[0] === 0) return 'PAUSE';
  for (const hand of activeHands) if (isOKPlayGesture(hand)) return 'PLAY';
  return '';
}

function updateControlGesture(control) {
  if (control === controlCandidate) controlStableFrames++;
  else {
    controlCandidate = control;
    controlStableFrames = 0;
  }
  const stable = controlStableFrames > CONTROL_STABLE_FRAMES;
  const cooled = frameCount - lastControlTriggerFrame > CONTROL_COOLDOWN_FRAMES;
  if (control && stable && cooled) {
    if (control === 'PLAY') startOrResumeSelectedTrack();
    if (control === 'PAUSE') pausePlayback();
    if (control === 'STOP') stopPlayback(true);
    lastControlTriggerFrame = frameCount;
  }
}

function getMp3ForTrack(track) {
  if (!track) return { sound: null, loaded: false };
  if (track.instrument === 'mp3_roar') return { sound: roarSound, loaded: roarLoaded };
  if (track.instrument === 'mp3_waltz') return { sound: waltzSound, loaded: waltzLoaded };
  if (track.instrument === 'mp3_interlude') return { sound: interludeSound, loaded: interludeLoaded };
  if (track.instrument === 'mp3_totoro') return { sound: totoroThemeSound, loaded: totoroThemeLoaded };
  return { sound: null, loaded: false };
}

function startOrResumeSelectedTrack() {
  if (!tracks[selectedTrackKey]) return;
  if (playerState === 'paused' && playingTrackKey === selectedTrackKey) return resumePlayback();
  playSelectedTrackFromStart();
}

function playSelectedTrackFromStart() {
  stopPlayback(false);
  const track = tracks[selectedTrackKey];
  playingTrackKey = selectedTrackKey;
  playerState = 'playing';
  currentSongTitle = track.title;
  currentSongColor = track.color;
  pauseElapsedMs = 0;
  audioPauseTime = 0;
  trackStartMs = millis();
  currentTrackDurationMs = getTrackDurationMs(track);

  if (track.instrument.startsWith('mp3_')) {
    const { sound, loaded } = getMp3ForTrack(track);
    if (loaded && sound) {
      sound.stop();
      sound.setVolume(0.9);
      sound.play();
      if (sound.duration && sound.duration() > 0) currentTrackDurationMs = sound.duration() * 1000;
      setLog(`PLAYING ${track.shortTitle}`);
      playUITone(1400);
    } else {
      setLog(`${track.shortTitle} NOT READY OR FILE NOT FOUND`);
      playUITone(220);
      playerState = 'stopped';
      playingTrackKey = null;
      currentSongTitle = 'No music playing';
    }
    return;
  }

  scheduleSynthTrack(track, 0);
  setLog(`PLAYING ${track.shortTitle}`);
  playUITone(1400);
}

function pausePlayback() {
  if (playerState !== 'playing') return;
  const track = tracks[playingTrackKey];
  pauseElapsedMs = millis() - trackStartMs;
  clearAllTimers();
  stopAllOscillators();

  if (track && track.instrument.startsWith('mp3_')) {
    const { sound } = getMp3ForTrack(track);
    if (sound && sound.isPlaying()) {
      audioPauseTime = sound.currentTime();
      sound.pause();
    }
  }

  playerState = 'paused';
  setLog('PAUSED');
}

function resumePlayback() {
  if (playerState !== 'paused' || !playingTrackKey) return;
  const track = tracks[playingTrackKey];
  playerState = 'playing';
  trackStartMs = millis() - pauseElapsedMs;
  currentSongTitle = track.title;
  currentSongColor = track.color;

  if (track.instrument.startsWith('mp3_')) {
    const { sound } = getMp3ForTrack(track);
    if (sound) {
      sound.play(0, 1, 0.9, audioPauseTime);
      setLog(`RESUMED ${track.shortTitle}`);
    }
    return;
  }

  scheduleSynthTrack(track, pauseElapsedMs);
  setLog(`RESUMED ${track.shortTitle}`);
}

function stopPlayback(showLog = true) {
  clearAllTimers();
  stopAllOscillators();
  if (roarSound && roarSound.isPlaying()) roarSound.stop();
  if (waltzSound && waltzSound.isPlaying()) waltzSound.stop();
  if (interludeSound && interludeSound.isPlaying()) interludeSound.stop();
  if (totoroThemeSound && totoroThemeSound.isPlaying()) totoroThemeSound.stop();
  playerState = 'stopped';
  playingTrackKey = null;
  pauseElapsedMs = 0;
  audioPauseTime = 0;
  currentSongTitle = 'No music playing';
  if (showLog) setLog('STOPPED');
}

function clearAllTimers() {
  timers.forEach(t => clearTimeout(t));
  timers = [];
}

function stopAllOscillators() {
  activeOscillators.forEach(o => { try { o.stop(); } catch(e) {} });
  activeOscillators = [];
}

function getTrackDurationMs(track) {
  if (track.instrument.startsWith('mp3_')) {
    const { sound } = getMp3ForTrack(track);
    if (sound && sound.duration && sound.duration() > 0) return sound.duration() * 1000;
    return 1;
  }
  const events = buildTrackEvents(track);
  let last = 0;
  events.forEach(e => last = max(last, e.time + e.dur));
  return max(last, 1);
}

function scheduleSynthTrack(track, offsetMs) {
  clearAllTimers();
  const events = buildTrackEvents(track);
  let lastTime = 0;

  events.forEach(event => {
    lastTime = max(lastTime, event.time + event.dur);
    if (event.time + event.dur < offsetMs) return;
    const delay = max(0, event.time - offsetMs);
    const timer = setTimeout(() => {
      if (playerState !== 'playing' || playingTrackKey !== track.key) return;
      if (event.note) playInstrumentNote(event.freq, event.dur, event.instrument, event.volume);
      if (event.chord) playChord(event.chord, event.dur, event.instrument, event.volume);
    }, delay);
    timers.push(timer);
  });

  const endTimer = setTimeout(() => {
    if (playerState === 'playing' && playingTrackKey === track.key) {
      playerState = 'stopped';
      playingTrackKey = null;
      currentSongTitle = 'No music playing';
      setLog(`${track.shortTitle} COMPLETE`);
    }
  }, max(0, lastTime - offsetMs + 800));
  timers.push(endTimer);
}

function buildTrackEvents(track) {
  let events = [];
  appendSequenceEvents(events, track.melody || [], track.instrument, track.tempo || 1, 1.0, 0);
  appendSequenceEvents(events, track.bass || [], 'bass', track.tempo || 1, 0.72, 0);
  events.sort((a,b) => a.time - b.time);
  return events;
}

function appendSequenceEvents(events, sequence, instrument, tempo, volume, startAt) {
  let t = startAt;
  sequence.forEach(step => {
    const dur = step.d * tempo;
    if (step.n && step.n !== 'R') events.push({ time: t, dur, instrument, volume, note: step.n, freq: NOTES[step.n] });
    if (step.chord) events.push({ time: t, dur, instrument, volume, chord: step.chord });
    t += dur;
  });
}

function trackOsc(o) { activeOscillators.push(o); return o; }

function playChord(noteNames, dur, instrument, volumeScale = 1) {
  noteNames.forEach((name, i) => {
    const timer = setTimeout(() => playInstrumentNote(NOTES[name], dur, instrument, volumeScale * 0.75), i * 24);
    timers.push(timer);
  });
}

function playInstrumentNote(freq, dur, instrument, volumeScale = 1) {
  if (!freq) return;
  if (instrument === 'piano') playPianoNote(freq, dur, volumeScale);
  else if (instrument === 'violin') playViolinNote(freq, dur, volumeScale);
  else if (instrument === 'musicbox') playMusicBoxNote(freq, dur, volumeScale);
  else if (instrument === 'bass') playBassNote(freq, dur, volumeScale);
}

function playPianoNote(freq, dur, volumeScale = 1) {
  let env = new p5.Envelope();
  env.setADSR(0.001, 0.07, 0.22, 0.22);
  env.setRange(0.45 * volumeScale, 0);
  let s1 = trackOsc(new p5.Oscillator('triangle'));
  let s2 = trackOsc(new p5.Oscillator('sine'));
  s1.freq(freq); s2.freq(freq * 2.01); s1.start(); s2.start(); s2.amp(0.10 * volumeScale); env.play(s1);
  setTimeout(() => { try { s1.stop(); s2.stop(); } catch(e) {} }, dur + 650);
}

function playViolinNote(freq, dur, volumeScale = 1) {
  let env = new p5.Envelope();
  env.setADSR(0.12, 0.12, 0.38, 0.28);
  env.setRange(0.28 * volumeScale, 0);
  let s1 = trackOsc(new p5.Oscillator('sawtooth'));
  let s2 = trackOsc(new p5.Oscillator('triangle'));
  s1.freq(freq); s2.freq(freq * 2.005); s1.start(); s2.start(); s2.amp(0.055 * volumeScale); env.play(s1);
  setTimeout(() => { try { s1.stop(); s2.stop(); } catch(e) {} }, dur + 700);
}

function playMusicBoxNote(freq, dur, volumeScale = 1) {
  let env = new p5.Envelope();
  env.setADSR(0.001, 0.04, 0.12, 0.25);
  env.setRange(0.38 * volumeScale, 0);
  let s1 = trackOsc(new p5.Oscillator('triangle'));
  let s2 = trackOsc(new p5.Oscillator('sine'));
  s1.freq(freq); s2.freq(freq * 2.0); s1.start(); s2.start(); s2.amp(0.06 * volumeScale); env.play(s1);
  setTimeout(() => { try { s1.stop(); s2.stop(); } catch(e) {} }, dur + 500);
}

function playBassNote(freq, dur, volumeScale = 1) {
  let env = new p5.Envelope();
  env.setADSR(0.005, 0.06, 0.25, 0.16);
  env.setRange(0.42 * volumeScale, 0);
  let s = trackOsc(new p5.Oscillator('square'));
  s.freq(freq); s.start(); env.play(s);
  setTimeout(() => { try { s.stop(); } catch(e) {} }, dur + 450);
}

function drawTopText() {
  fill(255);
  textAlign(CENTER, CENTER);
  textSize(18);
  text('Gesture Music Player - Stable Lite', width / 2, 24);
  fill(0,255,255,175);
  textSize(10);
  text('第 3 首 = My Neighbor Totoro Theme.mp3 ｜ 第 4 首 = Waltz in A-flat major.mp3 ｜ 第 5 首 = Interlude Lonesome George\'s Dream.mp3', width / 2, 44);
}

function drawBottomGuide() {
  const items = ['1','2','3','4','5','6'];
  const panelW = min(1120, width - 40);
  const panelH = 126;
  const x = width / 2 - panelW / 2;
  const y = height - panelH - 18;
  const cellW = panelW / items.length;

  noFill();
  stroke(0,255,255,115);
  rect(x, y, panelW, panelH, 14);
  fill(0,255,255,22);
  rect(x, y, panelW, panelH, 14);

  items.forEach((key, i) => {
    const tr = tracks[key];
    const c = tr.color;
    const selected = selectedTrackKey === key;
    const cx = x + i * cellW + cellW / 2;
    stroke(c[0], c[1], c[2], selected ? 255 : 120);
    fill(selected ? color(c[0], c[1], c[2], 68) : color(0,0,0,0));
    rect(x + i * cellW + 8, y + 12, cellW - 16, 92, 10);
    fill(c[0], c[1], c[2]);
    noStroke();
    textAlign(CENTER, CENTER);
    textSize(12);
    text(key, cx, y + 28);
    fill(255);
    textSize(9);
    text(tr.shortTitle, cx, y + 54);
    fill(255, 180);
    textSize(8);
    text(tr.title, cx, y + 90);
  });

  fill(255,170);
  noStroke();
  textSize(10);
  textAlign(CENTER, CENTER);
  text('控制：OK = 播放 / 繼續 ｜ 單手握拳 = 暫停 ｜ 雙手握拳 = 停止', width / 2, y + 114);
}
