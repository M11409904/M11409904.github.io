      // =========================
      // setup
      // =========================
      function setup() {
        createCanvas(windowWidth, windowHeight);

        uiOsc = new p5.Oscillator('sine');
        uiEnv = new p5.Envelope();
        uiEnv.setADSR(0.001, 0.05, 0.1, 0.1);
        uiEnv.setRange(0.45, 0);

        avatarImg = loadImage(
          AVATAR_IMAGE_FILE,
          () => {
            avatarReady = true;
            updateLog('AVATAR IMAGE READY');
          },
          () => {

            updateLog('AVATAR IMAGE NOT FOUND');
          }
        );

        handPose = ml5.handPose({ flipped: true, maxHands: 2 }, () => {
          document.getElementById('loading-msg').style.display = 'none';
          document.getElementById('init-btn').style.display = 'block';

        });

        angleMode(DEGREES);
        textFont('Courier New');
      }

      function initSystem() {
        userStartAudio();
        playBootSound();
        loadRoarSound();

        video = createCapture(VIDEO, () => {
          document.getElementById('overlay').style.display = 'none';
          startDetection();
        });
        video.size(640, 480);
        video.hide();
      }

      function startDetection() {
        isReady = true;
        updateLog('INITIALIZING DETECTOR...');

        handPose.detectStart(video, results => {
          hands = results;
          modelCheckTimer = 0;
        });
      }

      function updateLog(msg) {
        document.getElementById('status-log').innerText = `LOG: ${msg}`;
      }

      function playUITone(freq) {
        uiOsc.freq(freq);
        uiOsc.start();
        uiEnv.play(uiOsc);
      }

      function playBootSound() {
        let f = 300;
        let interval = setInterval(() => {
          playUITone(f);
          f += 220;
          if (f > 1600) clearInterval(interval);
        }, 50);
      }

      function loadRoarSound() {
        roarSound = loadSound(
          'Katy Perry - Roar.mp3',
          () => {
            roarLoaded = true;
            updateLog('ROAR MP3 READY');
          },
          () => {
            roarLoaded = false;
            updateLog('ROAR MP3 NOT FOUND');
          }
        );
      }

      // =========================
      // draw
      // =========================
      function draw() {
        background(10, 15, 25);
        if (!isReady) return;

        modelCheckTimer++;
        if (modelCheckTimer > 240) {
          updateLog('DETECTOR CHECK...');
          modelCheckTimer = 0;
        }

        // 背景相機（鏡像）
        push();
        translate(width, 0);
        scale(-1, 1);
        tint(0, 220, 255, 28);
        image(video, 0, 0, width, height);
        noTint();
        pop();

        if (hands && hands.length > 0) {
          handCounts = hands.map(h => countExtendedFingers(h));
          detectedFingerCount = constrain(handCounts.reduce((a, b) => a + b, 0), 0, MAX_FINGER_COUNT);

          drawAvatarHands();

          for (let i = 0; i < hands.length; i++) {
            drawHandSkeleton(hands[i]);
            drawHandTips(hands[i]);
          }

          let control = detectControlGesture(hands, handCounts);
          updateControlGesture(control);

          if (!control) {
            let selection = detectSelectionGesture(hands, handCounts);
            updateSelectionGesture(selection);
          } else {
            updateSelectionGesture('');
          }
        } else {
          detectedFingerCount = 0;
          handCounts = [];
          updateSelectionGesture('');
          updateControlGesture('');
          drawAvatarHands();
          drawScanLine();
        }

        drawTitleHUD();
        drawGuideHUD();
        drawStatusHUD();
      }

      // =========================
      // 手勢判斷
      // =========================
      function countExtendedFingers(hand) {
        let kp = hand.keypoints;
        let palm = kp[9];
        let count = 0;

        let thumbTip = kp[4];
        let thumbIp = kp[3];
        let thumbOpen = dist(thumbTip.x, thumbTip.y, palm.x, palm.y) > dist(thumbIp.x, thumbIp.y, palm.x, palm.y) + 18;
        if (thumbOpen) count++;

        if (kp[8].y  < kp[6].y  - 10) count++;
        if (kp[12].y < kp[10].y - 10) count++;
        if (kp[16].y < kp[14].y - 10) count++;
        if (kp[20].y < kp[18].y - 10) count++;

        return constrain(count, 0, 5);
      }

      function thumbAndIndexTouching(hand) {
        let kp = hand.keypoints;
        let thumbTip = kp[4];
        let indexTip = kp[8];
        let wrist = kp[0];
        let palm = kp[9];
        let handScale = dist(wrist.x, wrist.y, palm.x, palm.y);
        let d = dist(thumbTip.x, thumbTip.y, indexTip.x, indexTip.y);
        let threshold = max(22, handScale * 0.42);
        return d < threshold;
      }

      function isFingerExtended(hand, tipIdx, pipIdx) {
        let kp = hand.keypoints;
        return kp[tipIdx].y < kp[pipIdx].y - 10;
      }

      // O：選 Roar
      function isOSelectGesture(hand) {
        if (!thumbAndIndexTouching(hand)) return false;

        let middleOpen = isFingerExtended(hand, 12, 10);
        let ringOpen = isFingerExtended(hand, 16, 14);
        let pinkyOpen = isFingerExtended(hand, 20, 18);

        return !middleOpen && !ringOpen && !pinkyOpen;
      }

      // OK：播放 / 繼續
      function isOKPlayGesture(hand) {
        if (!thumbAndIndexTouching(hand)) return false;

        let middleOpen = isFingerExtended(hand, 12, 10);
        let ringOpen = isFingerExtended(hand, 16, 14);
        let pinkyOpen = isFingerExtended(hand, 20, 18);

        return middleOpen && ringOpen && pinkyOpen;
      }

      function detectSelectionGesture(activeHands, counts) {
        if (activeHands.some(h => isOSelectGesture(h))) return 'O';

        let total = constrain(counts.reduce((a, b) => a + b, 0), 0, MAX_FINGER_COUNT);
        if (total >= 1 && total <= MAX_FINGER_COUNT) return String(total);

        return '';
      }

      function updateSelectionGesture(selection) {
        if (selection === selectionCandidate) {
          selectionStableFrames++;
        } else {
          selectionCandidate = selection;
          selectionStableFrames = 0;
        }

        let stable = selectionStableFrames > SELECTION_STABLE_FRAMES;
        let cooledDown = frameCount - lastSelectionTriggerFrame > SELECTION_COOLDOWN_FRAMES;

        if (selection && stable && cooledDown && tracks[selection]) {
          selectTrack(selection);
          lastSelectionTriggerFrame = frameCount;
        }
      }

      function selectTrack(key) {
        selectedTrackKey = key;
        currentSongColor = tracks[key].color;
        updateLog(`SELECTED ${tracks[key].shortTitle}. USE OK TO PLAY.`);
        playUITone(1100);
      }

      // 控制手勢：
      // OK = play/resume
      // 單手拳頭 = pause
      // 雙手拳頭 = stop
      function detectControlGesture(activeHands, counts) {
        if (activeHands.length >= 2 && counts[0] === 0 && counts[1] === 0) return 'STOP';

        for (let i = 0; i < activeHands.length; i++) {
          if (isOKPlayGesture(activeHands[i])) return 'PLAY';
        }

        if (activeHands.length === 1 && counts[0] === 0) return 'PAUSE';

        return '';
      }

      function updateControlGesture(control) {
        if (control === controlCandidate) {
          controlStableFrames++;
        } else {
          controlCandidate = control;
          controlStableFrames = 0;
        }

        let stable = controlStableFrames > CONTROL_STABLE_FRAMES;
        let cooledDown = frameCount - lastControlTriggerFrame > CONTROL_COOLDOWN_FRAMES;

        if (control && stable && cooledDown) {
          if (control === 'PLAY') startOrResumeSelectedTrack();
          if (control === 'PAUSE') pausePlayback();
          if (control === 'STOP') stopPlayback(true);
          lastControlTriggerFrame = frameCount;
        }
      }

      // =========================
      // 播放控制
      // =========================
      function startOrResumeSelectedTrack() {
        if (!tracks[selectedTrackKey]) return;

        if (playerState === 'paused' && playingTrackKey === selectedTrackKey) {
          resumePlayback();
          return;
        }

        playSelectedTrackFromStart();
      }

      function playSelectedTrackFromStart() {
        stopPlayback(false);

        const track = tracks[selectedTrackKey];
        playingTrackKey = selectedTrackKey;
        playerState = 'playing';
        currentSongTitle = track.title;
        currentSongColor = track.color;
        pauseElapsedMs = 0;
        audioPauseTime = 0;
        trackStartMs = millis();

        if (track.instrument === 'mp3') {
          if (roarLoaded && roarSound) {
            roarSound.stop();
            roarSound.setVolume(0.9);
            roarSound.play();
            updateLog(`PLAYING ${track.shortTitle}`);
            playUITone(1400);
          } else {
            updateLog('ROAR MP3 NOT READY OR FILE NOT FOUND');
            playUITone(220);
            playerState = 'stopped';
            playingTrackKey = null;
            currentSongTitle = 'No music playing';
          }
          return;
        }

        scheduleSynthTrack(track, 0);
        updateLog(`PLAYING ${track.shortTitle}`);
        playUITone(1400);
      }

      function pausePlayback() {
        if (playerState !== 'playing') return;

        const track = tracks[playingTrackKey];
        pauseElapsedMs = millis() - trackStartMs;

        clearSongTimers();
        stopActiveOscillators();

        if (track && track.instrument === 'mp3' && roarSound && roarSound.isPlaying()) {
          audioPauseTime = roarSound.currentTime();
          roarSound.pause();
        }

        playerState = 'paused';
        updateLog('PLAYBACK PAUSED');
        playUITone(500);
      }

      function resumePlayback() {
        if (playerState !== 'paused' || !playingTrackKey) return;

        const track = tracks[playingTrackKey];
        playerState = 'playing';
        trackStartMs = millis() - pauseElapsedMs;
        currentSongTitle = track.title;
        currentSongColor = track.color;

        if (track.instrument === 'mp3') {
          if (roarLoaded && roarSound) {
            roarSound.play(0, 1, 0.9, audioPauseTime);
            updateLog(`RESUMED ${track.shortTitle}`);
            playUITone(1300);
          }
          return;
        }

        scheduleSynthTrack(track, pauseElapsedMs);
        updateLog(`RESUMED ${track.shortTitle}`);
        playUITone(1300);
      }

      function stopPlayback(showLog = true) {
        clearSongTimers();
        stopActiveOscillators();

        if (roarSound && roarSound.isPlaying && roarSound.isPlaying()) {
          roarSound.stop();
        }

        playerState = 'stopped';
        playingTrackKey = null;
        pauseElapsedMs = 0;
        audioPauseTime = 0;
        currentSongTitle = 'No music playing';

        if (showLog) {
          updateLog('PLAYBACK STOPPED');
          playUITone(260);
        }
      }

      function clearSongTimers() {
        songTimers.forEach(t => clearTimeout(t));
        songTimers = [];
      }

      function stopActiveOscillators() {
        activeOscillators.forEach(o => {
          try { o.stop(); } catch(e) {}
        });
        activeOscillators = [];
      }

      function scheduleSynthTrack(track, offsetMs) {
        clearSongTimers();

        const events = buildTrackEvents(track);
        let lastTime = 0;

        events.forEach(event => {
          lastTime = max(lastTime, event.time + event.dur);
          if (event.time + event.dur < offsetMs) return;

          const delay = max(0, event.time - offsetMs);
          const timer = setTimeout(() => {
            if (playerState !== 'playing' || playingTrackKey !== track.key) return;

            if (event.note) {
              playInstrumentNote(event.freq, event.dur, event.instrument, event.volume);
            }

            if (event.chord) {
              playChord(event.chord, event.dur, event.instrument, event.volume);
            }
          }, delay);

          songTimers.push(timer);
        });

        const endTimer = setTimeout(() => {
          if (playerState === 'playing' && playingTrackKey === track.key) {
            playerState = 'stopped';
            playingTrackKey = null;
            currentSongTitle = 'No music playing';
            updateLog(`${track.shortTitle} COMPLETE`);
          }
        }, max(0, lastTime - offsetMs + 800));

        songTimers.push(endTimer);
      }

      function buildTrackEvents(track) {
        let events = [];
        appendSequenceEvents(events, track.melody || [], track.instrument, track.tempo || 1, 1.0, 0);
        appendSequenceEvents(events, track.bass || [], 'bass', track.tempo || 1, 0.72, 0);
        events.sort((a, b) => a.time - b.time);
        return events;
      }

      function appendSequenceEvents(events, sequence, instrument, tempo, volume, startAt) {
        let t = startAt;

        sequence.forEach(step => {
          const dur = step.d * tempo;

          if (step.n && step.n !== 'R') {
            events.push({
              time: t,
              dur,
              instrument,
              volume,
              note: step.n,
              freq: NOTES[step.n]
            });
          }

          if (step.chord) {
            events.push({
              time: t,
              dur,
              instrument,
              volume,
              chord: step.chord
            });
          }

          t += dur;
        });
      }

      function trackOsc(o) {
        activeOscillators.push(o);
        return o;
      }

      function playChord(noteNames, dur, instrument, volumeScale = 1) {
        noteNames.forEach((name, i) => {
          const timer = setTimeout(() => {
            playInstrumentNote(NOTES[name], dur, instrument, volumeScale * 0.75);
          }, i * 24);
          songTimers.push(timer);
        });
      }

      function playInstrumentNote(freq, dur, instrument, volumeScale = 1) {
        if (!freq) return;

        if (instrument === 'piano') playPianoNote(freq, dur, volumeScale);
        else if (instrument === 'violin') playViolinNote(freq, dur, volumeScale);
        else if (instrument === 'harpsichord') playHarpsichordNote(freq, dur, volumeScale);
        else if (instrument === 'strings') playStringNote(freq, dur, volumeScale);
        else if (instrument === 'pad') playPadNote(freq, dur, volumeScale);
        else if (instrument === 'babySynth') playBabySynthNote(freq, dur, volumeScale);
        else if (instrument === 'bass') playBassNote(freq, dur, volumeScale);
      }

      function playPianoNote(freq, dur, volumeScale = 1) {
        let env = new p5.Envelope();
        env.setADSR(0.001, 0.07, 0.22, 0.22);
        env.setRange(0.45 * volumeScale, 0);

        let s1 = trackOsc(new p5.Oscillator('triangle'));
        let s2 = trackOsc(new p5.Oscillator('sine'));
        s1.freq(freq);
        s2.freq(freq * 2.01);
        s1.start();
        s2.start();
        s2.amp(0.10 * volumeScale);
        env.play(s1);

        setTimeout(() => {
          try { s1.stop(); s2.stop(); } catch(e) {}
        }, dur + 650);
      }

      function playViolinNote(freq, dur, volumeScale = 1) {
        let env = new p5.Envelope();
        env.setADSR(0.12, 0.12, 0.38, 0.28);
        env.setRange(0.28 * volumeScale, 0);

        let s1 = trackOsc(new p5.Oscillator('sawtooth'));
        let s2 = trackOsc(new p5.Oscillator('triangle'));
        s1.freq(freq);
        s2.freq(freq * 2.005);
        s1.start();
        s2.start();
        s2.amp(0.055 * volumeScale);
        env.play(s1);

        setTimeout(() => {
          try { s1.stop(); s2.stop(); } catch(e) {}
        }, dur + 700);
      }

      function playHarpsichordNote(freq, dur, volumeScale = 1) {
        let env = new p5.Envelope();
        env.setADSR(0.001, 0.05, 0.12, 0.12);
        env.setRange(0.34 * volumeScale, 0);

        let s = trackOsc(new p5.Oscillator('square'));
        s.freq(freq);
        s.start();
        env.play(s);

        setTimeout(() => {
          try { s.stop(); } catch(e) {}
        }, dur + 350);
      }

      function playStringNote(freq, dur, volumeScale = 1) {
        let env = new p5.Envelope();
        env.setADSR(0.06, 0.12, 0.42, 0.35);
        env.setRange(0.32 * volumeScale, 0);

        let s1 = trackOsc(new p5.Oscillator('sawtooth'));
        let s2 = trackOsc(new p5.Oscillator('sawtooth'));
        s1.freq(freq);
        s2.freq(freq * 1.005);
        s1.start();
        s2.start();
        s2.amp(0.08 * volumeScale);
        env.play(s1);

        setTimeout(() => {
          try { s1.stop(); s2.stop(); } catch(e) {}
        }, dur + 650);
      }

      function playPadNote(freq, dur, volumeScale = 1) {
        let env = new p5.Envelope();
        env.setADSR(0.22, 0.25, 0.28, 0.75);
        env.setRange(0.25 * volumeScale, 0);

        let s1 = trackOsc(new p5.Oscillator('sine'));
        let s2 = trackOsc(new p5.Oscillator('triangle'));
        s1.freq(freq);
        s2.freq(freq * 1.5);
        s1.start();
        s2.start();
        s2.amp(0.08 * volumeScale);
        env.play(s1);

        setTimeout(() => {
          try { s1.stop(); s2.stop(); } catch(e) {}
        }, dur + 1200);
      }

      function playBabySynthNote(freq, dur, volumeScale = 1) {
        let env = new p5.Envelope();
        env.setADSR(0.001, 0.06, 0.18, 0.18);
        env.setRange(0.48 * volumeScale, 0);

        let s1 = trackOsc(new p5.Oscillator('square'));
        let s2 = trackOsc(new p5.Oscillator('triangle'));
        s1.freq(freq);
        s2.freq(freq * 2.0);
        s1.start();
        s2.start();
        s2.amp(0.08 * volumeScale);
        env.play(s1);

        setTimeout(() => {
          try { s1.stop(); s2.stop(); } catch(e) {}
        }, dur + 420);
      }

      function playBassNote(freq, dur, volumeScale = 1) {
        let env = new p5.Envelope();
        env.setADSR(0.005, 0.06, 0.25, 0.16);
        env.setRange(0.42 * volumeScale, 0);

        let s = trackOsc(new p5.Oscillator('square'));
        s.freq(freq);
        s.start();
        env.play(s);

        setTimeout(() => {
          try { s.stop(); } catch(e) {}
        }, dur + 450);
      }

      // =========================
      // Avatar：只有紅線外側手臂會動
      // =========================
      function drawAvatarHands() {
        let avatarH = min(height * 0.60, height - 250, 660);
        avatarH = max(300, avatarH);

        let avatarW = avatarReady ? avatarH * (avatarImg.width / avatarImg.height) : avatarH * 0.88;
        let avatarX = width / 2 - avatarW / 2;
        let avatarY = 72;

        // 手與身體接點：靠近你畫的紅線上端
        let leftShoulder = {
          x: avatarX + avatarW * 0.35,
          y: avatarY + avatarH * 0.40
        };

        let rightShoulder = {
          x: avatarX + avatarW * 0.71,
          y: avatarY + avatarH * 0.40
        };

        // 沒有偵測到手時，回到原圖附近位置
        let leftRest = {
          x: avatarX + avatarW * 0.22,
          y: avatarY + avatarH * 0.34
        };

        let rightRest = {
          x: avatarX + avatarW * 0.84,
          y: avatarY + avatarH * 0.34
        };

        let leftTarget = { ...leftRest };
        let rightTarget = { ...rightRest };

        // 左右手追蹤
        if (hands && hands.length > 0) {
          hands.forEach(hand => {
            let palm = hand.keypoints[9] || hand.keypoints[0];
            let tx = map(palm.x, 0, 640, 0, width);
            let ty = map(palm.y, 0, 480, 0, height);

            if (tx < width / 2) {
              leftTarget = { x: tx, y: ty };
            } else {
              rightTarget = { x: tx, y: ty };
            }
          });
        }

        // 限制長度
        leftTarget = limitArmReach(leftShoulder, leftTarget, avatarW * 0.42);
        rightTarget = limitArmReach(rightShoulder, rightTarget, avatarW * 0.42);

        // 平滑
        if (!avatarLeftPaw) avatarLeftPaw = { x: leftRest.x, y: leftRest.y };
        if (!avatarRightPaw) avatarRightPaw = { x: rightRest.x, y: rightRest.y };

        avatarLeftPaw.x = lerp(avatarLeftPaw.x, leftTarget.x, 0.20);
        avatarLeftPaw.y = lerp(avatarLeftPaw.y, leftTarget.y, 0.20);

        avatarRightPaw.x = lerp(avatarRightPaw.x, rightTarget.x, 0.20);
        avatarRightPaw.y = lerp(avatarRightPaw.y, rightTarget.y, 0.20);

        if (avatarReady) {
          // 先畫紅線外側左右手
          drawArmSprite(avatarImg, LEFT_ARM_SPRITE, leftShoulder, avatarLeftPaw, avatarW, avatarH);
          drawArmSprite(avatarImg, RIGHT_ARM_SPRITE, rightShoulder, avatarRightPaw, avatarW, avatarH);

          // 再畫身體前景，蓋住內部接縫
          drawFrontBodyMask(avatarImg, avatarX, avatarY, avatarW, avatarH);
        } else {
          drawAvatarPlaceholder(avatarX, avatarY, avatarW, avatarH);
        }

        drawAvatarLinkHUD(avatarX, avatarY, avatarW);
      }

      function limitArmReach(shoulder, target, maxLen) {
        let dx = target.x - shoulder.x;
        let dy = target.y - shoulder.y;
        let d = sqrt(dx * dx + dy * dy);

        if (d > maxLen) {
          let k = maxLen / d;
          return {
            x: shoulder.x + dx * k,
            y: shoulder.y + dy * k
          };
        }

        return target;
      }

      function drawArmSprite(imgRef, crop, shoulder, paw, avatarW, avatarH) {
        let sx = imgRef.width * crop.x;
        let sy = imgRef.height * crop.y;
        let sw = imgRef.width * crop.w;
        let sh = imgRef.height * crop.h;

        let drawW = avatarW * crop.w;
        let drawH = avatarH * crop.h;

        let pivotX = crop.pivot.x * drawW;
        let pivotY = crop.pivot.y * drawH;

        let handleX = crop.handle.x * drawW;
        let handleY = crop.handle.y * drawH;

        // 原裁圖方向
        let sourceAngle = atan2(handleY - pivotY, handleX - pivotX);

        // 目標方向
        let targetAngle = atan2(paw.y - shoulder.y, paw.x - shoulder.x);
        let rotateDelta = targetAngle - sourceAngle;

        let sourceLen = dist(pivotX, pivotY, handleX, handleY);
        let targetLen = dist(shoulder.x, shoulder.y, paw.x, paw.y);
        let stretch = constrain(targetLen / max(sourceLen, 1), 0.82, 1.22);

        push();
        imageMode(CORNER);
        translate(shoulder.x, shoulder.y);
        rotate(rotateDelta);
        scale(stretch, stretch);

        image(imgRef, -pivotX, -pivotY, drawW, drawH, sx, sy, sw, sh);
        pop();

        // 控制提示圈（不是手）
        noFill();
        stroke(0, 255, 255, 100);
        strokeWeight(2);
        circle(paw.x, paw.y, 46 + sin(frameCount * 8) * 3);
      }

      function drawFrontBodyMask(imgRef, avatarX, avatarY, avatarW, avatarH) {
        push();

        drawingContext.save();
        drawingContext.beginPath();

        let pts = BODY_FRONT_PATH;
        let first = pts[0];
        drawingContext.moveTo(
          avatarX + avatarW * first.x,
          avatarY + avatarH * first.y
        );

        for (let i = 1; i < pts.length; i++) {
          let p = pts[i];
          drawingContext.lineTo(
            avatarX + avatarW * p.x,
            avatarY + avatarH * p.y
          );
        }

        drawingContext.closePath();
        drawingContext.clip();

        imageMode(CORNER);
        image(imgRef, avatarX, avatarY, avatarW, avatarH);

        drawingContext.restore();
        pop();
      }

      function drawAvatarPlaceholder(x, y, w, h) {
        push();
        translate(x + w / 2, y + h / 2);

        fill(95, 95, 88, 230);
        stroke(20, 25, 30);
        strokeWeight(4);
        ellipse(0, 20, w * 0.92, h * 0.86);

        fill(245, 235, 180, 235);
        noStroke();
        ellipse(0, h * 0.14, w * 0.68, h * 0.48);

        fill(255);
        circle(-w * 0.18, -h * 0.25, 34);
        circle(w * 0.18, -h * 0.25, 34);
        fill(0);
        circle(-w * 0.18, -h * 0.25, 14);
        circle(w * 0.18, -h * 0.25, 14);

        pop();
      }

      function drawAvatarLinkHUD(x, y, w) {
        push();
        translate(x + w / 2 - 155, y - 42);
        noFill();
        stroke(0, 255, 255, 160);
        rect(0, 0, 310, 32, 4);
        fill(0, 255, 255, 45);
        rect(0, 0, 310, 32, 4);
        fill(255);
        noStroke();
        textAlign(CENTER, CENTER);
        textSize(10);
        text('RED-LINE OUTER ARMS LINK ACTIVE', 155, 16);
        pop();
      }

      // =========================
      // 手部視覺
      // =========================
      function drawHandSkeleton(hand) {
        let connections = [
          [0,1],[1,2],[2,3],[3,4],
          [0,5],[5,6],[6,7],[7,8],
          [5,9],[9,10],[10,11],[11,12],
          [9,13],[13,14],[14,15],[15,16],
          [13,17],[17,18],[18,19],[19,20],
          [0,17]
        ];

        stroke(0,255,255,115);
        strokeWeight(2);

        connections.forEach(pair => {
          let a = hand.keypoints[pair[0]];
          let b = hand.keypoints[pair[1]];
          let ax = map(a.x, 0, 640, 0, width);
          let ay = map(a.y, 0, 480, 0, height);
          let bx = map(b.x, 0, 640, 0, width);
          let by = map(b.y, 0, 480, 0, height);
          line(ax, ay, bx, by);
        });
      }

      function drawHandTips(hand) {
        let tips = [4,8,12,16,20];
        noFill();
        stroke(255, 190);
        strokeWeight(1.5);

        tips.forEach(idx => {
          let k = hand.keypoints[idx];
          let x = map(k.x, 0, 640, 0, width);
          let y = map(k.y, 0, 480, 0, height);
          circle(x, y, 14);
        });
      }

      // =========================
      // HUD
      // =========================
      function drawTitleHUD() {
        push();
        fill(255);
        textAlign(CENTER, CENTER);
        textSize(18);
        text('Gesture Music + Totoro Red-Line Arm Control', width / 2, 24);
        pop();
      }

      function drawGuideHUD() {
        let panelW = min(1120, width - 40);
        let panelH = 136;
        let x = width / 2 - panelW / 2;
        let y = height - panelH - 18;

        push();
        noFill();
        stroke(0,255,255,120);
        rect(x, y, panelW, panelH, 8);
        fill(0,255,255,24);
        rect(x, y, panelW, panelH, 8);

        fill(255);
        noStroke();
        textAlign(CENTER, CENTER);
        textSize(10);

        text('選曲：數字 1~6 | O 手勢 = Roar.mp3', x + panelW/2, y + 18);
        text('播放控制：OK 手勢 = 播放 / 繼續 | 單手握拳 = 暫停 | 雙手握拳 = 停止', x + panelW/2, y + 38);
        text('圖片控制：只移動紅線外側左右手臂；紅線內側身體固定不動', x + panelW/2, y + 58);

        const keys = ['1','2','3','4','5','6','O'];
        const cellW = panelW / keys.length;

        keys.forEach((key, i) => {
          const tr = tracks[key];
          const c = tr.color;
          const selected = selectedTrackKey === key;

          stroke(c[0], c[1], c[2], selected ? 255 : 130);
          fill(selected ? color(c[0], c[1], c[2], 60) : color(0,0,0,0));
          rect(x + i * cellW + 6, y + 76, cellW - 12, 48, 4);

          fill(c[0], c[1], c[2], 255);
          noStroke();
          textSize(16);
          text(key, x + i * cellW + cellW / 2, y + 92);

          fill(255);
          textSize(8);
          text(tr.shortTitle, x + i * cellW + cellW / 2, y + 111);
        });

        pop();
      }

      function drawStatusHUD() {
        let c = currentSongColor;

        push();
        translate(width - 340, 46);
        noFill();
        stroke(c[0], c[1], c[2], 180);
        rect(0, 0, 300, 134, 4);

        fill(c[0], c[1], c[2], 48);
        rect(0, 0, 300, 134, 4);

        fill(255);
        noStroke();
        textAlign(CENTER, CENTER);
        textSize(10);
        text('SYSTEM STATUS', 150, 16);

        textSize(9);
        text(`SELECTED : ${tracks[selectedTrackKey].shortTitle}`, 150, 38);
        text(`STATE    : ${playerState.toUpperCase()}`, 150, 58);
        text(`NOW      : ${currentSongTitle}`, 150, 78);
        text(`COUNT    : ${detectedFingerCount}`, 150, 98);
        text(`CONTROL  : ${controlCandidate || '-'}`, 150, 114);
        pop();
      }

      function drawScanLine() {
        stroke(0,255,255,70);
        let sy = (frameCount * 4) % height;
        line(0, sy, width, sy);
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
      }
    </script>
  </body>
</html>
