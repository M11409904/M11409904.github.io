<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gesture Music Player - 5 Gestures Edition</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/addons/p5.sound.min.js"></script>
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #07101f;
        overflow: hidden;
        font-family: "Courier New", monospace;
      }

      #overlay {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, #102542 0%, #07101f 58%, #020611 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #0ff;
        z-index: 999;
      }

      .start-btn {
        margin-top: 18px;
        padding: 13px 34px;
        border: 1px solid #0ff;
        background: rgba(0, 255, 255, 0.06);
        color: #0ff;
        cursor: pointer;
        letter-spacing: 4px;
        font-size: 1.05rem;
        box-shadow: 0 0 18px rgba(0, 255, 255, 0.28);
      }

      #status-log {
        position: fixed;
        left: 12px;
        bottom: 10px;
        color: rgba(0,255,255,0.58);
        font-size: 11px;
        z-index: 1000;
      }
    </style>
  </head>

  <body>
    <div id="overlay">
      <div style="letter-spacing:8px; font-size:1.55rem;">GESTURE MUSIC PLAYER</div>
      <div id="loading-msg" style="margin-top:10px; font-size:12px; color:rgba(0,255,255,0.68);">
        LOADING AI ENGINE...
      </div>
      <button id="init-btn" class="start-btn" style="display:none;" onclick="initSystem()">
        ACTIVATE_LINK
      </button>
    </div>

    <div id="status-log">SYSTEM IDLE</div>

    <script>
      let video, handPose, hands = [];
      let isReady = false;
      let modelCheckTimer = 0;

      let uiOsc, uiEnv;
      let currentSongColor = [0, 255, 255];

      const DEFAULT_ART_FILE = 'totoro_cutout.png';
      let fallbackImg = null;
      let trackImages = {};
      let artFlashTimer = 0;

      let roarSound = null;
      let roarLoaded = false;
      let activeOscillators = [];
      let songTimers = [];

      let selectedTrackKey = 'LIKE';
      let playingTrackKey = null;
      let playerState = 'stopped';
      let currentSongTitle = 'No music playing';
      let trackStartMs = 0;
      let pauseElapsedMs = 0;
      let audioPauseTime = 0;
      let currentTrackDurationMs = 1;

      let handCounts = [];
      let detectedGestureLabel = '-';
      let selectionCandidate = '';
      let selectionStableFrames = 0;
      let lastSelectionTriggerFrame = -999;

      let controlCandidate = '';
      let controlStableFrames = 0;
      let lastControlTriggerFrame = -999;

      const SELECTION_STABLE_FRAMES = 18;
      const CONTROL_STABLE_FRAMES = 18;
      const SELECTION_COOLDOWN_FRAMES = 55;
      const CONTROL_COOLDOWN_FRAMES = 55;

      const NOTES = {
        C2: 65.41, Cs2: 69.30, D2: 73.42, Ds2: 77.78, E2: 82.41, F2: 87.31, Fs2: 92.50, G2: 98.00, Gs2: 103.83, A2: 110.00, As2: 116.54, B2: 123.47,
        C3: 130.81, Cs3: 138.59, D3: 146.83, Ds3: 155.56, E3: 164.81, F3: 174.61, Fs3: 185.00, G3: 196.00, Gs3: 207.65, A3: 220.00, As3: 233.08, B3: 246.94,
        C4: 261.63, Cs4: 277.18, D4: 293.66, Ds4: 311.13, E4: 329.63, F4: 349.23, Fs4: 369.99, G4: 392.00, Gs4: 415.30, A4: 440.00, As4: 466.16, B4: 493.88,
        C5: 523.25, Cs5: 554.37, D5: 587.33, Ds5: 622.25, E5: 659.25, F5: 698.46, Fs5: 739.99, G5: 783.99, Gs5: 830.61, A5: 880.00, As5: 932.33, B5: 987.77,
        C6: 1046.50, Cs6: 1108.73, D6: 1174.66, Ds6: 1244.51, E6: 1318.51, F6: 1396.91, Fs6: 1479.98, G6: 1567.98, A6: 1760.00
      };

      function N(n, d) { return { n, d }; }
      function C(chord, d) { return { chord, d }; }
      function seq(...items) { return items; }
      function cloneSeq(s) { return s.map(step => ({ ...step, chord: step.chord ? [...step.chord] : undefined })); }
      function rep(s, times) { let out = []; for (let i = 0; i < times; i++) out = out.concat(cloneSeq(s)); return out; }

      const trackArtFiles = {
        LIKE: 'cover_1_mozart.png',
        V: 'cover_2_furelise.png',
        HEART: 'cover_4_spring.png',
        TIGER: 'cover_6_roar.png',
        DOUBLE_V: 'cover_3_totoro.png'
      };

      const tracks = buildTracks();

      function buildTracks() {
        const mozA = seq(N('G4',220), N('D4',220), N('G4',220), N('B4',220), N('D5',440), N('B4',220), N('G4',440), N('D5',220), N('B4',220), N('D5',220), N('G5',220), N('Fs5',300), N('E5',140), N('D5',440));
        const mozB = seq(N('E5',220), N('C5',220), N('E5',220), N('G5',220), N('Fs5',300), N('E5',140), N('D5',440), N('B4',220), N('G4',220), N('A4',220), N('Fs4',220), N('G4',660));
        const mozC = seq(N('B4',220), N('D5',220), N('G5',220), N('B5',220), N('A5',220), N('G5',220), N('Fs5',220), N('E5',220), N('D5',220), N('C5',220), N('B4',220), N('A4',220), N('G4',700));
        const mozMelody = rep(mozA, 2).concat(rep(mozB, 2)).concat(rep(mozC, 2)).concat(rep(mozA, 1)).concat(rep(mozB, 1));
        const mozBass = rep(seq(N('G3',440), N('D3',440), N('G3',440), N('D3',440), N('C3',440), N('D3',440), N('G2',880)), 6);

        const furA = seq(N('E5',160), N('Ds5',160), N('E5',160), N('Ds5',160), N('E5',160), N('B4',160), N('D5',160), N('C5',160), N('A4',420), N('C4',160), N('E4',160), N('A4',160), N('B4',420));
        const furB = seq(N('E4',160), N('Gs4',160), N('B4',160), N('C5',420), N('E4',160), N('E5',160), N('Ds5',160), N('E5',160), N('Ds5',160), N('E5',160), N('B4',160), N('D5',160), N('C5',160), N('A4',520));
        const furC = seq(N('A4',180), N('B4',180), N('C5',180), N('E5',180), N('A5',360), N('G5',180), N('E5',180), N('C5',180), N('G4',180), N('E4',360), N('A4',180), N('C5',180), N('E5',540));
        const furMelody = rep(furA, 2).concat(rep(furB, 2)).concat(rep(furC, 2)).concat(rep(furA, 1)).concat(rep(furB, 1));
        const furBass = rep(seq(N('A2',640), N('E3',640), N('A2',640), N('E3',640), N('A2',880)), 7);

        const springA = seq(N('E5',180), N('E5',180), N('E5',180), N('D5',180), N('C5',360), N('C5',180), N('D5',180), N('E5',360));
        const springB = seq(N('G5',180), N('G5',180), N('G5',180), N('F5',180), N('E5',360), N('D5',180), N('C5',180), N('B4',360));
        const springC = seq(N('C5',180), N('E5',180), N('G5',180), N('C6',180), N('B5',180), N('A5',180), N('G5',360), N('E5',180), N('D5',180), N('C5',600));
        const springD = seq(N('E5',180), N('G5',180), N('B5',180), N('A5',180), N('G5',180), N('F5',180), N('E5',180), N('D5',180), N('C5',220), N('D5',220), N('E5',600));
        const springMelody = rep(springA, 2).concat(rep(springB, 2)).concat(rep(springC, 2)).concat(rep(springD, 2)).concat(rep(springA, 1));
        const springBass = rep(seq(N('C3',720), N('G2',720), N('C3',720), N('G2',720), N('C3',720)), 6);

        const totoA = seq(N('G4',220), N('B4',220), N('D5',220), N('G5',380), N('Fs5',180), N('E5',180), N('D5',220), N('B4',220), N('A4',220), N('B4',220), N('D5',440));
        const totoB = seq(N('G4',220), N('A4',220), N('B4',220), N('D5',220), N('E5',380), N('D5',180), N('B4',180), N('A4',220), N('G4',220), N('B4',220), N('D5',440));
        const totoC = seq(N('D5',180), N('E5',180), N('G5',220), N('A5',220), N('G5',220), N('E5',220), N('D5',220), N('B4',220), N('A4',220), N('G4',220), N('D5',660));
        const totoD = seq(N('G4',220), N('B4',220), N('D5',220), N('G5',220), N('A5',220), N('G5',220), N('Fs5',220), N('E5',220), N('D5',220), N('B4',220), N('A4',220), N('G4',700));
        const totoMelody = rep(totoA, 2).concat(rep(totoB, 2)).concat(rep(totoC, 2)).concat(rep(totoD, 2));
        const totoBass = rep(seq(N('G3',440), N('D3',440), N('E3',440), N('B2',440), N('C3',440), N('D3',440), N('G2',880)), 6);

        return {
          LIKE: {
            key: 'LIKE',
            shortTitle: 'MOZART VIOLIN',
            title: 'Mozart / Eine kleine Nachtmusik',
            gestureLabel: '讚 👍',
            instrument: 'violin',
            color: [255, 90, 140],
            tempo: 1.0,
            melody: mozMelody,
            bass: mozBass
          },
          V: {
            key: 'V',
            shortTitle: 'BEETHOVEN PIANO',
            title: 'Beethoven / Fur Elise',
            gestureLabel: 'V ✌️',
            instrument: 'piano',
            color: [120, 220, 255],
            tempo: 1.0,
            melody: furMelody,
            bass: furBass
          },
          HEART: {
            key: 'HEART',
            shortTitle: 'VIVALDI STRINGS',
            title: 'Vivaldi / Spring',
            gestureLabel: '愛心',
            instrument: 'strings',
            color: [150, 255, 160],
            tempo: 0.92,
            melody: springMelody,
            bass: springBass
          },
          TIGER: {
            key: 'TIGER',
            shortTitle: 'ROAR MP3',
            title: 'Katy Perry / Roar.mp3',
            gestureLabel: '老虎',
            instrument: 'mp3',
            color: [255, 120, 80],
            file: 'Katy Perry - Roar.mp3'
          },
          DOUBLE_V: {
            key: 'DOUBLE_V',
            shortTitle: 'TOTORO THEME',
            title: 'My Neighbor Totoro Theme',
            gestureLabel: '雙手 V',
            instrument: 'musicbox',
            color: [150, 255, 190],
            tempo: 1.0,
            melody: totoMelody,
            bass: totoBass
          }
        };
      }

      function isFingerOpen(hand, tipIdx, pipIdx) {
        const kp = hand.keypoints;
        return kp[tipIdx].y < kp[pipIdx].y - 10;
      }

      function isFingerCurled(hand, tipIdx, pipIdx) {
        const kp = hand.keypoints;
        return kp[tipIdx].y > kp[pipIdx].y - 4;
      }

      function isThumbUp(hand) {
        const count = countExtendedFingers(hand);
        if (count !== 1) return false;
        const kp = hand.keypoints;
        const palm = kp[9];
        const thumbTip = kp[4];
        const thumbIp = kp[3];
        const thumbOpen = dist(thumbTip.x, thumbTip.y, palm.x, palm.y) > dist(thumbIp.x, thumbIp.y, palm.x, palm.y) + 18;
        const indexClosed = isFingerCurled(hand, 8, 6);
        const middleClosed = isFingerCurled(hand, 12, 10);
        const ringClosed = isFingerCurled(hand, 16, 14);
        const pinkyClosed = isFingerCurled(hand, 20, 18);
        return thumbOpen && indexClosed && middleClosed && ringClosed && pinkyClosed;
      }

      function isVSign(hand) {
        const indexOpen = isFingerOpen(hand, 8, 6);
        const middleOpen = isFingerOpen(hand, 12, 10);
        const ringClosed = isFingerCurled(hand, 16, 14);
        const pinkyClosed = isFingerCurled(hand, 20, 18);
        const kp = hand.keypoints;
        const spread = dist(kp[8].x, kp[8].y, kp[12].x, kp[12].y);
        return indexOpen && middleOpen && ringClosed && pinkyClosed && spread > 28;
      }

      function thumbIndexTouching(hand) {
        const kp = hand.keypoints;
        const wrist = kp[0];
        const palm = kp[9];
        const handScale = dist(wrist.x, wrist.y, palm.x, palm.y);
        const d = dist(kp[4].x, kp[4].y, kp[8].x, kp[8].y);
        return d < max(22, handScale * 0.42);
      }

      function isHeartGesture(hand) {
        if (!thumbIndexTouching(hand)) return false;
        const middleClosed = isFingerCurled(hand, 12, 10);
        const ringClosed = isFingerCurled(hand, 16, 14);
        const pinkyClosed = isFingerCurled(hand, 20, 18);
        return middleClosed && ringClosed && pinkyClosed;
      }

      function isTigerGesture(hand) {
        const kp = hand.keypoints;
        const thumbFar = dist(kp[4].x, kp[4].y, kp[9].x, kp[9].y) > dist(kp[3].x, kp[3].y, kp[9].x, kp[9].y) + 10;
        const indexCurled = isFingerCurled(hand, 8, 6);
        const middleCurled = isFingerCurled(hand, 12, 10);
        const ringCurled = isFingerCurled(hand, 16, 14);
        const pinkyCurled = isFingerCurled(hand, 20, 18);
        const allTipsFarEnough = [4,8,12,16,20].every(idx => dist(kp[idx].x, kp[idx].y, kp[9].x, kp[9].y) > 42);
        return thumbFar && indexCurled && middleCurled && ringCurled && pinkyCurled && allTipsFarEnough;
      }

      function isOpenPalm(hand) {
        return countExtendedFingers(hand) >= 4;
      }

      function detectSelectionGesture(activeHands) {
        if (activeHands.length >= 2) {
          const leftHand = activeHands.find(h => h.keypoints[9].x < 320) || activeHands[0];
          const rightHand = activeHands.find(h => h.keypoints[9].x >= 320) || activeHands[1];
          if (leftHand && rightHand && isVSign(leftHand) && isVSign(rightHand)) {
            detectedGestureLabel = '雙手 V';
            return 'DOUBLE_V';
          }
        }

        for (const hand of activeHands) {
          if (isHeartGesture(hand)) { detectedGestureLabel = '愛心'; return 'HEART'; }
        }
        for (const hand of activeHands) {
          if (isThumbUp(hand)) { detectedGestureLabel = '讚'; return 'LIKE'; }
        }
        for (const hand of activeHands) {
          if (isTigerGesture(hand)) { detectedGestureLabel = '老虎'; return 'TIGER'; }
        }
        for (const hand of activeHands) {
          if (isVSign(hand)) { detectedGestureLabel = 'V'; return 'V'; }
        }

        detectedGestureLabel = '-';
        return '';
      }

      function updateSelectionGesture(selection) {
        if (selection === selectionCandidate) selectionStableFrames++;
        else {
          selectionCandidate = selection;
          selectionStableFrames = 0;
        }

        const stable = selectionStableFrames > SELECTION_STABLE_FRAMES;
        const cooledDown = frameCount - lastSelectionTriggerFrame > SELECTION_COOLDOWN_FRAMES;

        if (selection && stable && cooledDown && tracks[selection]) {
          selectTrack(selection);
          lastSelectionTriggerFrame = frameCount;
        }
      }

      function selectTrack(key) {
        selectedTrackKey = key;
        currentSongColor = tracks[key].color;
        artFlashTimer = 18;
        updateLog(`SELECTED ${tracks[key].shortTitle}. USE 2 OPEN HANDS TO PLAY.`);
        playUITone(1100);
      }

      function detectControlGesture(activeHands) {
        if (activeHands.length >= 2 && activeHands.every(h => countExtendedFingers(h) === 0)) return 'STOP';
        if (activeHands.length === 1 && countExtendedFingers(activeHands[0]) === 0) return 'PAUSE';
        if (activeHands.length >= 2 && activeHands.every(h => isOpenPalm(h))) return 'PLAY';
        return '';
      }

      function updateControlGesture(control) {
        if (control === controlCandidate) controlStableFrames++;
        else {
          controlCandidate = control;
          controlStableFrames = 0;
        }

        const stable = controlStableFrames > CONTROL_STABLE_FRAMES;
        const cooledDown = frameCount - lastControlTriggerFrame > CONTROL_COOLDOWN_FRAMES;

        if (control && stable && cooledDown) {
          if (control === 'PLAY') startOrResumeSelectedTrack();
          if (control === 'PAUSE') pausePlayback();
          if (control === 'STOP') stopPlayback(true);
          lastControlTriggerFrame = frameCount;
        }
      }

      function countExtendedFingers(hand) {
        const kp = hand.keypoints;
        const palm = kp[9];
        let count = 0;
        const thumbOpen = dist(kp[4].x, kp[4].y, palm.x, palm.y) > dist(kp[3].x, kp[3].y, palm.x, palm.y) + 18;
        if (thumbOpen) count++;
        if (kp[8].y < kp[6].y - 10) count++;
        if (kp[12].y < kp[10].y - 10) count++;
        if (kp[16].y < kp[14].y - 10) count++;
        if (kp[20].y < kp[18].y - 10) count++;
        return constrain(count, 0, 5);
      }

      function startOrResumeSelectedTrack() {
        if (!tracks[selectedTrackKey]) return;
        if (playerState === 'paused' && playingTrackKey === selectedTrackKey) return resumePlayback();
        playSelectedTrackFromStart();
      }

      function playSelectedTrackFromStart() {
        stopPlayback(false);
        const track = tracks[selectedTrackKey];
        playingTrackKey = selectedTrackKey;
        playerState = 'playing';
        currentSongTitle = track.title;
        currentSongColor = track.color;
        pauseElapsedMs = 0;
        audioPauseTime = 0;
        trackStartMs = millis();
        currentTrackDurationMs = getTrackDurationMs(track);

        if (track.instrument === 'mp3') {
          if (roarLoaded && roarSound) {
            roarSound.stop();
            roarSound.setVolume(0.9);
            roarSound.play();
            if (roarSound.duration && roarSound.duration() > 0) currentTrackDurationMs = roarSound.duration() * 1000;
            updateLog(`PLAYING ${track.shortTitle}`);
            playUITone(1400);
          } else {
            updateLog('ROAR MP3 NOT READY OR FILE NOT FOUND');
            playUITone(220);
            playerState = 'stopped';
            playingTrackKey = null;
            currentSongTitle = 'No music playing';
          }
          return;
        }

        scheduleSynthTrack(track, 0);
        updateLog(`PLAYING ${track.shortTitle}`);
        playUITone(1400);
      }

      function pausePlayback() {
        if (playerState !== 'playing') return;
        const track = tracks[playingTrackKey];
        pauseElapsedMs = millis() - trackStartMs;
        clearSongTimers();
        stopActiveOscillators();
        if (track && track.instrument === 'mp3' && roarSound && roarSound.isPlaying()) {
          audioPauseTime = roarSound.currentTime();
          roarSound.pause();
        }
        playerState = 'paused';
        updateLog('PLAYBACK PAUSED');
        playUITone(500);
      }

      function resumePlayback() {
        if (playerState !== 'paused' || !playingTrackKey) return;
        const track = tracks[playingTrackKey];
        playerState = 'playing';
        trackStartMs = millis() - pauseElapsedMs;
        currentSongTitle = track.title;
        currentSongColor = track.color;

        if (track.instrument === 'mp3') {
          if (roarLoaded && roarSound) {
            roarSound.play(0, 1, 0.9, audioPauseTime);
            updateLog(`RESUMED ${track.shortTitle}`);
            playUITone(1300);
          }
          return;
        }

        scheduleSynthTrack(track, pauseElapsedMs);
        updateLog(`RESUMED ${track.shortTitle}`);
        playUITone(1300);
      }

      function stopPlayback(showLog = true) {
        clearSongTimers();
        stopActiveOscillators();
        if (roarSound && roarSound.isPlaying && roarSound.isPlaying()) roarSound.stop();
        playerState = 'stopped';
        playingTrackKey = null;
        pauseElapsedMs = 0;
        audioPauseTime = 0;
        currentSongTitle = 'No music playing';
        if (showLog) {
          updateLog('PLAYBACK STOPPED');
          playUITone(260);
        }
      }

      function clearSongTimers() {
        songTimers.forEach(t => clearTimeout(t));
        songTimers = [];
      }

      function stopActiveOscillators() {
        activeOscillators.forEach(o => { try { o.stop(); } catch(e) {} });
        activeOscillators = [];
      }

      function getTrackDurationMs(track) {
        if (track.instrument === 'mp3' && roarSound && roarSound.duration && roarSound.duration() > 0) return roarSound.duration() * 1000;
        const events = buildTrackEvents(track);
        let last = 0;
        events.forEach(e => last = max(last, e.time + e.dur));
        return max(last, 1);
      }

      function scheduleSynthTrack(track, offsetMs) {
        clearSongTimers();
        const events = buildTrackEvents(track);
        let lastTime = 0;
        events.forEach(event => {
          lastTime = max(lastTime, event.time + event.dur);
          if (event.time + event.dur < offsetMs) return;
          const delay = max(0, event.time - offsetMs);
          const timer = setTimeout(() => {
            if (playerState !== 'playing' || playingTrackKey !== track.key) return;
            if (event.note) playInstrumentNote(event.freq, event.dur, event.instrument, event.volume);
            if (event.chord) playChord(event.chord, event.dur, event.instrument, event.volume);
          }, delay);
          songTimers.push(timer);
        });
        const endTimer = setTimeout(() => {
          if (playerState === 'playing' && playingTrackKey === track.key) {
            playerState = 'stopped';
            playingTrackKey = null;
            currentSongTitle = 'No music playing';
            updateLog(`${track.shortTitle} COMPLETE`);
          }
        }, max(0, lastTime - offsetMs + 800));
        songTimers.push(endTimer);
      }

      function buildTrackEvents(track) {
        let events = [];
        appendSequenceEvents(events, track.melody || [], track.instrument, track.tempo || 1, 1.0, 0);
        appendSequenceEvents(events, track.bass || [], 'bass', track.tempo || 1, 0.72, 0);
        events.sort((a, b) => a.time - b.time);
        return events;
      }

      function appendSequenceEvents(events, sequence, instrument, tempo, volume, startAt) {
        let t = startAt;
        sequence.forEach(step => {
          const dur = step.d * tempo;
          if (step.n && step.n !== 'R') events.push({ time: t, dur, instrument, volume, note: step.n, freq: NOTES[step.n] });
          if (step.chord) events.push({ time: t, dur, instrument, volume, chord: step.chord });
          t += dur;
        });
      }

      function trackOsc(o) { activeOscillators.push(o); return o; }

      function playChord(noteNames, dur, instrument, volumeScale = 1) {
        noteNames.forEach((name, i) => {
          const timer = setTimeout(() => playInstrumentNote(NOTES[name], dur, instrument, volumeScale * 0.75), i * 24);
          songTimers.push(timer);
        });
      }

      function playInstrumentNote(freq, dur, instrument, volumeScale = 1) {
        if (!freq) return;
        if (instrument === 'piano') playPianoNote(freq, dur, volumeScale);
        else if (instrument === 'violin') playViolinNote(freq, dur, volumeScale);
        else if (instrument === 'strings') playStringNote(freq, dur, volumeScale);
        else if (instrument === 'musicbox') playMusicBoxNote(freq, dur, volumeScale);
        else if (instrument === 'bass') playBassNote(freq, dur, volumeScale);
      }

      function playPianoNote(freq, dur, volumeScale = 1) {
        let env = new p5.Envelope(); env.setADSR(0.001, 0.07, 0.22, 0.22); env.setRange(0.45 * volumeScale, 0);
        let s1 = trackOsc(new p5.Oscillator('triangle')); let s2 = trackOsc(new p5.Oscillator('sine'));
        s1.freq(freq); s2.freq(freq * 2.01); s1.start(); s2.start(); s2.amp(0.10 * volumeScale); env.play(s1);
        setTimeout(() => { try { s1.stop(); s2.stop(); } catch(e) {} }, dur + 650);
      }

      function playViolinNote(freq, dur, volumeScale = 1) {
        let env = new p5.Envelope(); env.setADSR(0.12, 0.12, 0.38, 0.28); env.setRange(0.28 * volumeScale, 0);
        let s1 = trackOsc(new p5.Oscillator('sawtooth')); let s2 = trackOsc(new p5.Oscillator('triangle'));
        s1.freq(freq); s2.freq(freq * 2.005); s1.start(); s2.start(); s2.amp(0.055 * volumeScale); env.play(s1);
        setTimeout(() => { try { s1.stop(); s2.stop(); } catch(e) {} }, dur + 700);
      }

      function playStringNote(freq, dur, volumeScale = 1) {
        let env = new p5.Envelope(); env.setADSR(0.06, 0.12, 0.42, 0.35); env.setRange(0.32 * volumeScale, 0);
        let s1 = trackOsc(new p5.Oscillator('sawtooth')); let s2 = trackOsc(new p5.Oscillator('sawtooth'));
        s1.freq(freq); s2.freq(freq * 1.005); s1.start(); s2.start(); s2.amp(0.08 * volumeScale); env.play(s1);
        setTimeout(() => { try { s1.stop(); s2.stop(); } catch(e) {} }, dur + 650);
      }

      function playMusicBoxNote(freq, dur, volumeScale = 1) {
        let env = new p5.Envelope(); env.setADSR(0.001, 0.04, 0.12, 0.25); env.setRange(0.38 * volumeScale, 0);
        let s1 = trackOsc(new p5.Oscillator('triangle')); let s2 = trackOsc(new p5.Oscillator('sine'));
        s1.freq(freq); s2.freq(freq * 2.0); s1.start(); s2.start(); s2.amp(0.06 * volumeScale); env.play(s1);
        setTimeout(() => { try { s1.stop(); s2.stop(); } catch(e) {} }, dur + 500);
      }

      function playBassNote(freq, dur, volumeScale = 1) {
        let env = new p5.Envelope(); env.setADSR(0.005, 0.06, 0.25, 0.16); env.setRange(0.42 * volumeScale, 0);
        let s = trackOsc(new p5.Oscillator('square')); s.freq(freq); s.start(); env.play(s);
        setTimeout(() => { try { s.stop(); } catch(e) {} }, dur + 450);
      }

      function drawHandSkeleton(hand) {
        const connections = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
        stroke(0,255,255,120); strokeWeight(2);
        connections.forEach(pair => {
          const a = hand.keypoints[pair[0]], b = hand.keypoints[pair[1]];
          line(map(a.x,0,640,0,width), map(a.y,0,480,0,height), map(b.x,0,640,0,width), map(b.y,0,480,0,height));
        });
      }

      function drawHandTips(hand) {
        const tips = [4,8,12,16,20];
        noFill(); stroke(255,205); strokeWeight(1.5);
        tips.forEach(idx => {
          const k = hand.keypoints[idx];
          circle(map(k.x,0,640,0,width), map(k.y,0,480,0,height), 15);
        });
      }

      function drawTitleHUD() {
        push();
        fill(255); textAlign(CENTER, CENTER); textSize(18);
        text('Gesture Music Player - 5 Gestures', width / 2, 25);
        fill(0,255,255,175); textSize(10);
        text('讚 / V / 愛心 / 老虎 / 雙手 V 選曲  •  雙手張開播放  •  單拳暫停  •  雙拳停止', width / 2, 47);
        pop();
      }

      function drawGuideHUD() {
        const panelW = min(1140, width - 40);
        const panelH = 126;
        const x = width / 2 - panelW / 2;
        const y = height - panelH - 18;
        const items = ['LIKE','V','HEART','TIGER','DOUBLE_V'];
        const cellW = panelW / items.length;

        push();
        noFill(); stroke(0,255,255,115); rect(x, y, panelW, panelH, 14);
        fill(0,255,255,22); rect(x, y, panelW, panelH, 14);

        items.forEach((key, i) => {
          const tr = tracks[key];
          const c = tr.color;
          const selected = selectedTrackKey === key;
          const cx = x + i * cellW + cellW / 2;

          stroke(c[0], c[1], c[2], selected ? 255 : 120);
          fill(selected ? color(c[0], c[1], c[2], 68) : color(0,0,0,0));
          rect(x + i * cellW + 8, y + 12, cellW - 16, 92, 10);

          fill(c[0], c[1], c[2], 255); noStroke(); textAlign(CENTER, CENTER);
          textSize(12); text(tr.gestureLabel, cx, y + 28);
          fill(255); textSize(9); text(tr.shortTitle, cx, y + 54);
          fill(255, 150); textSize(8); text(tr.instrument.toUpperCase(), cx, y + 74);
          fill(255, 190); textSize(8); text(tr.title, cx, y + 90);
        });

        fill(255,170); noStroke(); textAlign(CENTER, CENTER); textSize(10);
        text('CONTROL: 2 OPEN PALMS = PLAY / RESUME    |    1 FIST = PAUSE    |    2 FISTS = STOP', width / 2, y + 114);
        pop();
      }

      function drawStatusHUD() {
        const c = currentSongColor;
        push();
        translate(width - 340, 66);
        noFill(); stroke(c[0], c[1], c[2], 165); rect(0, 0, 300, 148, 10);
        fill(c[0], c[1], c[2], 38); rect(0, 0, 300, 148, 10);
        fill(255); noStroke(); textAlign(CENTER, CENTER); textSize(10);
        text('LIVE STATUS', 150, 17);
        textSize(9);
        text(`SELECTED : ${tracks[selectedTrackKey].shortTitle}`, 150, 41);
        text(`STATE    : ${playerState.toUpperCase()}`, 150, 63);
        text(`NOW      : ${currentSongTitle}`, 150, 85);
        text(`GESTURE  : ${detectedGestureLabel}`, 150, 107);
        text(`CONTROL  : ${controlCandidate || '-'}`, 150, 129);
        pop();
      }

      function drawScanLine() {
        stroke(0,255,255,70);
        const sy = (frameCount * 4) % height;
        line(0, sy, width, sy);
      }

      function windowResized() { resizeCanvas(windowWidth, windowHeight); }
    </script>
  </body>
</html>
