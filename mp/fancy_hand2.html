<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gesture Music Player - Stable Lite</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/addons/p5.sound.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #08111f;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
    }
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #08111f;
      z-index: 99;
      color: #7ff;
    }
    button {
      margin-top: 18px;
      padding: 12px 22px;
      border: 1px solid #7ff;
      background: transparent;
      color: #7ff;
      font-size: 18px;
      cursor: pointer;
    }
    #log {
      position: fixed;
      left: 12px;
      bottom: 10px;
      color: rgba(255,255,255,0.75);
      font-size: 14px;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <div style="font-size: 28px; letter-spacing: 2px;">Gesture Music Player</div>
    <div id="loading" style="margin-top:10px; font-size:14px;">Loading AI model...</div>
    <button id="startBtn" onclick="initSystem()" style="display:none;">開始</button>
  </div>
  <div id="log">SYSTEM IDLE</div>

<script>
let video, handPose, hands = [];
let ready = false;
let modelReady = false;

let uiOsc, uiEnv;
let roarSound = null;
let roarLoaded = false;
let activeOscillators = [];
let timers = [];

let fallbackImg = null;
let artworks = {};

let selectedTrackKey = 'LIKE';
let playingTrackKey = null;
let playerState = 'stopped';
let currentSongTitle = 'No music playing';
let currentTrackDurationMs = 1;
let trackStartMs = 0;
let pauseElapsedMs = 0;
let audioPauseTime = 0;

let selectionCandidate = '';
let selectionStableFrames = 0;
let lastSelectionTriggerFrame = -999;
let controlCandidate = '';
let controlStableFrames = 0;
let lastControlTriggerFrame = -999;
let detectedGestureLabel = '-';

const SELECTION_STABLE_FRAMES = 14;
const CONTROL_STABLE_FRAMES = 14;
const SELECTION_COOLDOWN_FRAMES = 40;
const CONTROL_COOLDOWN_FRAMES = 40;

const NOTES = {
  C2: 65.41, D2: 73.42, E2: 82.41, F2: 87.31, G2: 98.00, A2: 110.00, B2: 123.47,
  C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.00, A3: 220.00, B3: 246.94,
  C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
  C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00, B5: 987.77,
  C6: 1046.50
};

function N(n, d) { return { n, d }; }
function C(chord, d) { return { chord, d }; }
function seq(...items) { return items; }
function cloneSeq(s) { return s.map(step => ({...step, chord: step.chord ? [...step.chord] : undefined})); }
function rep(s, times) { let out = []; for (let i = 0; i < times; i++) out = out.concat(cloneSeq(s)); return out; }

const trackArtFiles = {
  LIKE: 'cover_1_mozart.png',
  V: 'cover_2_furelise.png',
  HEART: 'cover_4_spring.png',
  TIGER: 'cover_6_roar.png',
  DOUBLE_V: 'cover_3_totoro.png'
};

const tracks = buildTracks();

function buildTracks() {
  const mozMelody = rep(seq(N('G4',220), N('D4',220), N('G4',220), N('B4',220), N('D5',440), N('B4',220), N('G4',440), N('E5',220), N('C5',220), N('E5',220), N('G5',220), N('D5',660)), 4);
  const mozBass = rep(seq(N('G3',440), N('D3',440), N('C3',440), N('D3',440), N('G2',880)), 5);

  const furMelody = rep(seq(N('E5',160), N('D5',160), N('E5',160), N('D5',160), N('E5',160), N('B4',160), N('D5',160), N('C5',160), N('A4',420), N('C4',160), N('E4',160), N('A4',160), N('B4',420)), 4);
  const furBass = rep(seq(N('A2',640), N('E3',640), N('A2',880)), 6);

  const springMelody = rep(seq(N('E5',180), N('E5',180), N('E5',180), N('D5',180), N('C5',360), N('D5',180), N('E5',360), N('G5',180), N('G5',180), N('F5',180), N('E5',360), N('C5',600)), 4);
  const springBass = rep(seq(N('C3',720), N('G2',720), N('C3',720)), 6);

  const totoMelody = rep(seq(N('G4',220), N('B4',220), N('D5',220), N('G5',380), N('E5',180), N('D5',220), N('B4',220), N('A4',220), N('B4',220), N('D5',440)), 5);
  const totoBass = rep(seq(N('G3',440), N('D3',440), N('C3',440), N('D3',440), N('G2',880)), 5);

  return {
    LIKE: {
      key: 'LIKE', gestureLabel: '讚 👍', shortTitle: 'MOZART', title: 'Mozart / Eine kleine Nachtmusik', instrument: 'violin', color: [255, 90, 140], tempo: 1.0, melody: mozMelody, bass: mozBass
    },
    V: {
      key: 'V', gestureLabel: 'V ✌️', shortTitle: 'FUR ELISE', title: 'Beethoven / Fur Elise', instrument: 'piano', color: [120, 220, 255], tempo: 1.0, melody: furMelody, bass: furBass
    },
    HEART: {
      key: 'HEART', gestureLabel: '愛心', shortTitle: 'SPRING', title: 'Vivaldi / Spring', instrument: 'strings', color: [150, 255, 160], tempo: 0.95, melody: springMelody, bass: springBass
    },
    TIGER: {
      key: 'TIGER', gestureLabel: '老虎', shortTitle: 'ROAR', title: 'Katy Perry / Roar.mp3', instrument: 'mp3', color: [255, 120, 80], file: 'Katy Perry - Roar.mp3'
    },
    DOUBLE_V: {
      key: 'DOUBLE_V', gestureLabel: '雙手 V', shortTitle: 'TOTORO', title: 'My Neighbor Totoro Theme', instrument: 'musicbox', color: [150, 255, 190], tempo: 1.0, melody: totoMelody, bass: totoBass
    }
  };
}

function setup() {
  createCanvas(windowWidth, windowHeight);
  angleMode(DEGREES);

  uiOsc = new p5.Oscillator('sine');
  uiEnv = new p5.Envelope();
  uiEnv.setADSR(0.001, 0.05, 0.1, 0.1);
  uiEnv.setRange(0.4, 0);

  fallbackImg = loadImage('totoro_cutout.png', ()=>{}, ()=>{});
  for (const key in trackArtFiles) {
    artworks[key] = null;
    loadImage(trackArtFiles[key], img => artworks[key] = img, () => artworks[key] = null);
  }

  handPose = ml5.handPose({ flipped: true, maxHands: 2 }, () => {
    modelReady = true;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('startBtn').style.display = 'block';
    setLog('MODEL READY');
  });
}

function initSystem() {
  userStartAudio();
  loadRoarSound();
  playUITone(880);
  video = createCapture(VIDEO, () => {
    document.getElementById('overlay').style.display = 'none';
    handPose.detectStart(video, results => { hands = results; });
    ready = true;
  });
  video.size(640, 480);
  video.hide();
}

function setLog(msg) {
  document.getElementById('log').innerText = msg;
}

function loadRoarSound() {
  roarSound = loadSound('Katy Perry - Roar.mp3', () => {
    roarLoaded = true;
    setLog('ROAR READY');
  }, () => {
    roarLoaded = false;
    setLog('ROAR MP3 NOT FOUND');
  });
}

function playUITone(freq) {
  uiOsc.freq(freq);
  uiOsc.start();
  uiEnv.play(uiOsc);
}

function draw() {
  background(8, 17, 31);
  if (!ready) return;

  if (video) {
    push();
    translate(width, 0);
    scale(-1, 1);
    tint(80, 140, 255, 22);
    image(video, 0, 0, width, height);
    noTint();
    pop();
  }

  drawPlayerCard();

  if (hands && hands.length > 0) {
    hands.forEach(drawHandSimple);

    const control = detectControlGesture(hands);
    updateControlGesture(control);

    if (!control) {
      const selection = detectSelectionGesture(hands);
      updateSelectionGesture(selection);
    } else {
      updateSelectionGesture('');
    }
  } else {
    detectedGestureLabel = '-';
    updateSelectionGesture('');
    updateControlGesture('');
  }

  if (artFlashTimer > 0) artFlashTimer--;
  drawTopText();
  drawBottomGuide();
}

function drawPlayerCard() {
  const track = tracks[selectedTrackKey];
  const art = artworks[selectedTrackKey] || fallbackImg;
  const c = currentSongColor;
  const cardW = min(520, width * 0.42);
  const cardH = min(690, height * 0.74);
  const x = width / 2 - cardW / 2;
  const y = 60;
  const artSize = min(cardW - 64, cardH * 0.55);
  const artX = x + cardW / 2 - artSize / 2;
  const artY = y + 36;

  noStroke();
  fill(0,0,0,120);
  rect(x + 12, y + 14, cardW, cardH, 24);

  stroke(c[0], c[1], c[2], 180);
  strokeWeight(2);
  fill(11, 22, 40, 228);
  rect(x, y, cardW, cardH, 24);

  if (playerState === 'playing') {
    noFill();
    for (let i = 0; i < 3; i++) {
      stroke(c[0], c[1], c[2], 70 - i * 18);
      rect(x - 8 - i * 8, y - 8 - i * 8, cardW + 16 + i * 16, cardH + 16 + i * 16, 28);
    }
  }

  fill(0,0,0,110);
  noStroke();
  rect(artX + 8, artY + 10, artSize, artSize, 22);

  stroke(c[0], c[1], c[2], 200);
  fill(18, 28, 45);
  rect(artX, artY, artSize, artSize, 22);

  if (art) {
    image(art, artX + 8, artY + 8, artSize - 16, artSize - 16);
  } else {
    fill(50, 60, 80);
    noStroke();
    rect(artX + 8, artY + 8, artSize - 16, artSize - 16, 18);
  }

  if (artFlashTimer > 0) {
    noFill();
    stroke(255,255,255,180);
    strokeWeight(4);
    rect(artX - 6, artY - 6, artSize + 12, artSize + 12, 26);
  }

  fill(c[0], c[1], c[2]);
  noStroke();
  textAlign(CENTER, CENTER);
  textSize(14);
  text(track.gestureLabel, x + cardW / 2, artY + artSize + 26);
  fill(255);
  textSize(24);
  text(track.shortTitle, x + cardW / 2, artY + artSize + 56);
  fill(220);
  textSize(12);
  text(track.title, x + cardW / 2, artY + artSize + 82);
  fill(255, 160);
  textSize(11);
  text(`STYLE: ${track.instrument.toUpperCase()}`, x + cardW / 2, artY + artSize + 104);

  const barX = x + 42;
  const barY = artY + artSize + 132;
  const barW = cardW - 84;
  const progress = getProgressRatio();

  fill(255,255,255,38);
  noStroke();
  rect(barX, barY, barW, 10, 8);
  fill(c[0], c[1], c[2], 220);
  rect(barX, barY, barW * progress, 10, 8);

  fill(255, 180);
  textAlign(LEFT, CENTER);
  textSize(10);
  const elapsed = playerState === 'paused' ? pauseElapsedMs : max(0, millis() - trackStartMs);
  text(formatTime(elapsed), barX, barY + 24);
  textAlign(RIGHT, CENTER);
  text(formatTime(currentTrackDurationMs), barX + barW, barY + 24);

  drawStateBadge(x + cardW / 2, barY + 58, c);
}

function drawStateBadge(cx, cy, c) {
  const label = playerState.toUpperCase();
  const icon = playerState === 'playing' ? '▶' : playerState === 'paused' ? 'Ⅱ' : '■';
  rectMode(CENTER);
  stroke(c[0], c[1], c[2], 180);
  fill(c[0], c[1], c[2], 48);
  rect(cx, cy, 170, 34, 18);
  fill(255);
  noStroke();
  textAlign(CENTER, CENTER);
  textSize(12);
  text(`${icon} ${label}`, cx, cy);
  rectMode(CORNER);
}

function getProgressRatio() {
  if (playerState === 'stopped') return 0;
  const elapsed = playerState === 'paused' ? pauseElapsedMs : max(0, millis() - trackStartMs);
  return constrain(elapsed / max(currentTrackDurationMs, 1), 0, 1);
}

function formatTime(ms) {
  ms = max(0, ms || 0);
  const totalSec = floor(ms / 1000);
  const m = floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${nf(s, 2)}`;
}

function drawHandSimple(hand) {
  const pts = hand.keypoints;
  stroke(0,255,255,110);
  strokeWeight(2);
  const connections = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
  connections.forEach(([a,b]) => {
    line(map(pts[a].x,0,640,0,width), map(pts[a].y,0,480,0,height), map(pts[b].x,0,640,0,width), map(pts[b].y,0,480,0,height));
  });
}

function drawTopText() {
  fill(255);
  textAlign(CENTER, CENTER);
  textSize(18);
  text('Gesture Music Player - Stable Lite', width / 2, 24);
  fill(0,255,255,175);
  textSize(10);
  text('手勢選曲：讚 / V / 愛心 / 老虎 / 雙手 V', width / 2, 44);
}

function drawBottomGuide() {
  const items = ['LIKE','V','HEART','TIGER','DOUBLE_V'];
  const panelW = min(1120, width - 40);
  const panelH = 126;
  const x = width / 2 - panelW / 2;
  const y = height - panelH - 18;
  const cellW = panelW / items.length;

  noFill();
  stroke(0,255,255,115);
  rect(x, y, panelW, panelH, 14);
  fill(0,255,255,22);
  rect(x, y, panelW, panelH, 14);

  items.forEach((key, i) => {
    const tr = tracks[key];
    const c = tr.color;
    const selected = selectedTrackKey === key;
    const cx = x + i * cellW + cellW / 2;
    stroke(c[0], c[1], c[2], selected ? 255 : 120);
    fill(selected ? color(c[0], c[1], c[2], 68) : color(0,0,0,0));
    rect(x + i * cellW + 8, y + 12, cellW - 16, 92, 10);
    fill(c[0], c[1], c[2]);
    noStroke();
    textAlign(CENTER, CENTER);
    textSize(12);
    text(tr.gestureLabel, cx, y + 28);
    fill(255);
    textSize(9);
    text(tr.shortTitle, cx, y + 54);
    fill(255, 180);
    textSize(8);
    text(tr.title, cx, y + 90);
  });

  fill(255,170);
  noStroke();
  textSize(10);
  textAlign(CENTER, CENTER);
  text('控制：雙手張開 = 播放 / 繼續 ｜ 單手握拳 = 暫停 ｜ 雙手握拳 = 停止', width / 2, y + 114);
}
</script>
</body>
</html>
