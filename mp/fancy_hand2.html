<!DOCTYPE html>
<html lang="en">

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0a0f19;
        overflow: hidden;
        font-family: 'Courier New', monospace;
      }
      
      .nav-group {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 2000;
        display: flex;
        gap: 10px;
      }
      
      .nav-btn { 
        padding: 10px 15px;
        font-size: 0.75em;
        border-radius: 4px; 
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 2px;
        transition: all 0.3s;
        cursor: pointer;
      }
      
      #back-btn {
        background: rgba(0, 255, 255, 0.05);
        border: 1px solid rgba(0, 255, 255, 0.2);

      }
      
      .nav-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        box-shadow: 0 0 10px currentColor;
      }

        position: fixed;

      #status-log {

        color: rgba(0, 255, 255, 0.4);
        font-size: 10px;
        z-index: 2000;

  <body>
    <div class="nav-group">

    <div id="overlay">
      <div style="letter-spacing: 8px; font-size: 1.5em;">CORE_STABILIZER_V3</div>
      <div id="loading-msg" style="margin-top:10px; font-size: 12px; color: rgba(0,255,255,0.6);">LOADING AI ENGINE...</div>
      <button id="init-btn" class="start-btn" onclick="initSystem()" style="display:none;">ACTIVATE_LINK</button>
    </div>

    <script>
      let video, handPose, hands = [];
      let isReady = false;
      let smoothedAngle = [0, 0], lastTickAngle = [0, 0], smoothedPos = [{x:0, y:0}, {x:0, y:0}];
      let mainColor, colors = ['#00ffff', '#ff00ff', '#ffff00'], colorIdx = 0;
      let glitchTimer = 0, osc, envelope, linkOsc;
      let modelCheckTimer = 0;

      // ===== 手指數字觸發整段音樂 =====
      // 使用方式：伸出 1 到 5 根手指，維持一下，就會觸發對應樂曲。
      // 這裡用 p5.sound 合成器即時演奏，不需要 mp3 / wav 檔案。

      const NOTES = {
        C2: 65.41, Cs2: 69.30, D2: 73.42, Ds2: 77.78, E2: 82.41, F2: 87.31, Fs2: 92.50, G2: 98.00, Gs2: 103.83, A2: 110.00, As2: 116.54, B2: 123.47,
        C3: 130.81, Cs3: 138.59, D3: 146.83, Ds3: 155.56, E3: 164.81, F3: 174.61, Fs3: 185.00, G3: 196.00, Gs3: 207.65, A3: 220.00, As3: 233.08, B3: 246.94,

        C5: 523.25, Cs5: 554.37, D5: 587.33, Ds5: 622.25, E5: 659.25, F5: 698.46, Fs5: 739.99, G5: 783.99, Gs5: 830.61, A5: 880.00, As5: 932.33, B5: 987.77,
        C6: 1046.50, Cs6: 1108.73, D6: 1174.66, Ds6: 1244.51, E6: 1318.51, F6: 1396.91, Fs6: 1479.98, G6: 1567.98, A6: 1760.00

      const fingerSongMap = {
        1: {

            { n: 'D5', d: 220 }, { n: 'B4', d: 220 }, { n: 'D5', d: 220 }, { n: 'G5', d: 220 }, { n: 'Fs5', d: 300 }, { n: 'E5', d: 140 }, { n: 'D5', d: 440 },

            { n: 'C4', d: 160 }, { n: 'E4', d: 160 }, { n: 'A4', d: 160 }, { n: 'B4', d: 420 },
            { n: 'E4', d: 160 }, { n: 'Gs4', d: 160 }, { n: 'B4', d: 160 }, { n: 'C5', d: 420 },
            { n: 'E4', d: 160 }, { n: 'E5', d: 160 }, { n: 'Ds5', d: 160 }, { n: 'E5', d: 160 }, { n: 'Ds5', d: 160 }, { n: 'E5', d: 160 }, { n: 'B4', d: 160 }, { n: 'D5', d: 160 }, { n: 'C5', d: 160 }, { n: 'A4', d: 520 }
          ],
          bass: [
            { n: 'A2', d: 640 }, { n: 'E3', d: 640 }, { n: 'A2', d: 640 }, { n: 'E3', d: 640 }, { n: 'A2', d: 880 }
          ]
        },
        3: {

          color: [255, 255, 140],

          melody: [
            { n: 'G4', d: 220 }, { n: 'D5', d: 220 }, { n: 'B4', d: 220 }, { n: 'C5', d: 220 }, { n: 'D5', d: 440 }, { n: 'G4', d: 220 }, { n: 'G4', d: 220 },
            { n: 'E5', d: 220 }, { n: 'C5', d: 220 }, { n: 'D5', d: 220 }, { n: 'E5', d: 220 }, { n: 'Fs5', d: 440 }, { n: 'G5', d: 220 }, { n: 'G4', d: 220 },

            { n: 'B4', d: 220 }, { n: 'A4', d: 220 }, { n: 'G4', d: 660 }
          ],
          bass: [

          ]
        },
        4: {

            { n: 'G5', d: 180 }, { n: 'G5', d: 180 }, { n: 'G5', d: 180 }, { n: 'F5', d: 180 }, { n: 'E5', d: 360 }, { n: 'D5', d: 180 }, { n: 'C5', d: 180 }, { n: 'B4', d: 360 },
            { n: 'C5', d: 180 }, { n: 'E5', d: 180 }, { n: 'G5', d: 180 }, { n: 'C6', d: 180 }, { n: 'B5', d: 180 }, { n: 'A5', d: 180 }, { n: 'G5', d: 360 },
            { n: 'E5', d: 180 }, { n: 'D5', d: 180 }, { n: 'C5', d: 600 }
          ],
          bass: [
            { n: 'C3', d: 720 }, { n: 'G2', d: 720 }, { n: 'C3', d: 720 }, { n: 'G2', d: 720 }, { n: 'C3', d: 720 }
          ]
        },
        5: {
          title: '5 - Pachelbel / Canon in D',
          shortTitle: 'CANON ORCHESTRA',
          instrument: 'pad',
          color: [220, 160, 255],
          tempo: 1.05,
          melody: [
            { chord: ['D4', 'Fs4', 'A4'], d: 520 }, { chord: ['A3', 'Cs4', 'E4'], d: 520 }, { chord: ['B3', 'D4', 'Fs4'], d: 520 }, { chord: ['Fs3', 'A3', 'Cs4'], d: 520 },
            { chord: ['G3', 'B3', 'D4'], d: 520 }, { chord: ['D3', 'Fs3', 'A3'], d: 520 }, { chord: ['G3', 'B3', 'D4'], d: 520 }, { chord: ['A3', 'Cs4', 'E4'], d: 520 },
            { n: 'Fs4', d: 180 }, { n: 'E4', d: 180 }, { n: 'D4', d: 180 }, { n: 'Cs4', d: 180 }, { n: 'B3', d: 180 }, { n: 'A3', d: 180 }, { n: 'B3', d: 180 }, { n: 'Cs4', d: 180 }, { n: 'D4', d: 700 }
          ],
          bass: [
            { n: 'D2', d: 520 }, { n: 'A2', d: 520 }, { n: 'B2', d: 520 }, { n: 'Fs2', d: 520 },
            { n: 'G2', d: 520 }, { n: 'D2', d: 520 }, { n: 'G2', d: 520 }, { n: 'A2', d: 520 }
          ]
        },
        6: {
          title: '6 - Baby Shark',
          shortTitle: 'BABY SHARK',
          instrument: 'babySynth',
          color: [255, 210, 80],
          tempo: 1.0,
          // 內建 Baby Shark 風格合成器旋律，不需要任何 mp3 / wav 音檔。
          melody: [
            { n: 'C5', d: 180 }, { n: 'D5', d: 180 }, { n: 'E5', d: 180 }, { n: 'C5', d: 180 },
            { n: 'C5', d: 180 }, { n: 'D5', d: 180 }, { n: 'E5', d: 180 }, { n: 'C5', d: 260 },
            { n: 'E5', d: 180 }, { n: 'F5', d: 180 }, { n: 'G5', d: 240 }, { n: 'E5', d: 180 },
            { n: 'F5', d: 180 }, { n: 'G5', d: 320 },
            { n: 'G5', d: 140 }, { n: 'A5', d: 140 }, { n: 'G5', d: 140 }, { n: 'E5', d: 140 },
            { n: 'C5', d: 360 }
          ],
          bass: [
            { n: 'C3', d: 360 }, { n: 'G3', d: 360 }, { n: 'C3', d: 360 }, { n: 'G3', d: 360 },
            { n: 'F3', d: 360 }, { n: 'G3', d: 360 }, { n: 'C3', d: 520 }
          ]
        }
      };

      let detectedFingerCount = 0;
      let countCandidate = 0;
      let countStableFrames = 0;
      let lastTriggeredCount = 0;
      let lastSongTriggerFrame = -999;
      let currentSongNumber = 0;
      let currentSongTitle = '';
      let currentSongColor = [0, 255, 255];
      let currentSongTimers = [];
      let songPlayingFrames = 0;

      // ===== 比 O / OK 手勢播放本機 MP3 =====
      // 請把音檔放在 html 同一個資料夾，檔名必須完全相同：Katy Perry - Roar.mp3
      let roarSound = null;
      let roarLoadStarted = false;
      let okGestureDetected = false;
      let okGestureStableFrames = 0;
      let okGestureActive = false;
      let lastOKTriggerFrame = -999;


      const COUNT_STABLE_FRAMES = 22;
      const SONG_TRIGGER_COOLDOWN_FRAMES = 90;
      const MAX_FINGER_COUNT = 6;
      const OK_GESTURE_STABLE_FRAMES = 18;
      const OK_GESTURE_COOLDOWN_FRAMES = 150;

      let buttons = [
        { label: 'COLOR', x: 40, y: 120, w: 90, h: 40, active: false },
        { label: 'GLITCH', x: 40, y: 170, w: 90, h: 40, active: false }
      ];

      function setup() {
        createCanvas(windowWidth, windowHeight);
        mainColor = color(colors[colorIdx]);
        
        // 原本的短音效系統
        osc = new p5.Oscillator('sine');
        envelope = new p5.Envelope();
        envelope.setADSR(0.001, 0.05, 0.1, 0.1);
        envelope.setRange(0.5, 0);

        // 原本的雙手能量連線低頻音
        linkOsc = new p5.Oscillator('sawtooth');
        linkOsc.amp(0);
        
        handPose = ml5.handPose({ flipped: true, maxHands: 2 }, () => {
          document.getElementById('loading-msg').style.display = 'none';
          document.getElementById('init-btn').style.display = 'block';
          updateLog("MODEL ENGINE READY");
        });

        angleMode(DEGREES);
        textFont('Courier New');
      }

      function updateLog(msg) {
        document.getElementById('status-log').innerText = `LOG: ${msg}`;
      }

      function initSystem() {
        // 瀏覽器規定音效必須由使用者點擊後啟動
        userStartAudio();
        playBootSound();
        loadRoarSound();

        video = createCapture(VIDEO, () => {
          document.getElementById('overlay').style.display = 'none';
          startDetection();
        });

        video.size(640, 480);
        video.hide();
      }

      function startDetection() {
        isReady = true;
        updateLog("INITIALIZING DETECTOR...");

        handPose.detectStart(video, results => {
          hands = results;
          modelCheckTimer = 0;
        });
      }

      function playTone(freq) {
        osc.freq(freq);
        osc.start();
        envelope.play(osc);
      }

      function playBootSound() {
        let f = 300;
        let interval = setInterval(() => {
          playTone(f);
          f += 250;
          if (f > 1800) clearInterval(interval);
        }, 50);
      }

      function draw() {
        background(10, 15, 25);
        if (!isReady) return;

        modelCheckTimer++;
        if (modelCheckTimer > 180) { 
          updateLog("DETECTOR HANG DETECTED. RESTARTING...");
          startDetection();
          modelCheckTimer = 0;
        }

        let gx = (glitchTimer > 0) ? random(-15, 15) : 0;
        let gy = (glitchTimer > 0) ? random(-5, 5) : 0;
        if (glitchTimer > 0) glitchTimer--;

        push();
        translate(width + gx, gy);
        scale(-1, 1);
        tint(red(mainColor), green(mainColor), blue(mainColor), 50);
        image(video, 0, 0, width, height, 0, 0, video.width, video.height, COVER);
        pop();

        if (hands && hands.length > 0) {
          for (let i = 0; i < hands.length; i++) {
            let hand = hands[i];
            let indexTip = hand.keypoints[8];
            let tx = map(indexTip.x, 0, 640, 0, width);
            let ty = map(indexTip.y, 0, 480, 0, height);

            checkButtons(tx, ty);
            drawSciFiSkeleton(hand, gx, gy);
            drawFingertips(hand, gx, gy);
            drawHoloDial(hand, i, gx, gy);
            drawCursor(tx, ty);
          }

          // 比 O / OK 手勢會優先觸發 Roar.mp3，避免同時被誤判成數字手勢
          updateOKGestureTrigger(hands);

          // 使用雙手合計判斷 1 到 6；例如一手 5 根 + 另一手 1 根 = 6
          if (!okGestureDetected) {
            updateFingerCountTrigger(hands);
          }

          if (hands.length === 2) {
            let d = dist(
              map(hands[0].keypoints[9].x, 0, 640, 0, width),
              map(hands[0].keypoints[9].y, 0, 480, 0, height),
              map(hands[1].keypoints[9].x, 0, 640, 0, width),
              map(hands[1].keypoints[9].y, 0, 480, 0, height)
            );

            let proximity = map(d, 100, 800, 1, 0, true);
            drawEnergyLink(hands[0], hands[1], proximity, gx, gy);
            linkOsc.amp(map(proximity, 0, 1, 0.05, 0.5), 0.1);
            linkOsc.freq(80 + proximity * 100);
            linkOsc.start();
          } else {
            linkOsc.amp(0, 0.5);
          }
        } else {
          linkOsc.amp(0, 0.5);
          detectedFingerCount = 0;
          countCandidate = 0;
          countStableFrames = 0;
          lastTriggeredCount = 0;
          okGestureDetected = false;
          okGestureStableFrames = 0;
          okGestureActive = false;
          drawScanningUI();
        }

        drawVirtualButtons(gx, gy);
        drawSongPanel();
        drawFingerCountHUD();
        drawNowPlayingHUD();
        drawOKGestureHUD();

        if (songPlayingFrames > 0) songPlayingFrames--;
      }

      // ===== 比 O / OK 手勢：播放 Katy Perry - Roar.mp3 =====
      function loadRoarSound() {
        if (roarLoadStarted || roarSound) return;

        roarLoadStarted = true;

        roarSound = loadSound(
          'Katy Perry - Roar.mp3',
          () => {
            updateLog('ROAR MP3 READY');
          },
          () => {
            roarSound = null;
            updateLog('ROAR MP3 NOT FOUND');
          }
        );
      }

      function updateOKGestureTrigger(activeHands) {
        okGestureDetected = false;

        for (let i = 0; i < activeHands.length; i++) {
          if (isOKGesture(activeHands[i])) {
            okGestureDetected = true;
            break;
          }
        }

        if (okGestureDetected) {
          okGestureStableFrames++;
        } else {
          okGestureStableFrames = 0;
          okGestureActive = false;
          return;
        }

        let stable = okGestureStableFrames > OK_GESTURE_STABLE_FRAMES;
        let cooledDown = frameCount - lastOKTriggerFrame > OK_GESTURE_COOLDOWN_FRAMES;

        if (stable && !okGestureActive && cooledDown) {
          playRoarSong();
          okGestureActive = true;
          lastOKTriggerFrame = frameCount;
        }
      }

      function isOKGesture(hand) {
        let kp = hand.keypoints;
        let thumbTip = kp[4];
        let indexTip = kp[8];
        let wrist = kp[0];
        let palm = kp[9];

        let handScale = dist(wrist.x, wrist.y, palm.x, palm.y);
        let thumbIndexDistance = dist(thumbTip.x, thumbTip.y, indexTip.x, indexTip.y);
        let okThreshold = max(22, handScale * 0.42);

        // 拇指尖與食指尖靠近，視為比 O / OK。
        return thumbIndexDistance < okThreshold;
      }

      function playRoarSong() {
        stopScheduledSong();

        currentSongNumber = 0;
        currentSongTitle = 'O - Katy Perry / Roar.mp3';
        currentSongColor = [255, 120, 80];
        songPlayingFrames = 360;

        if (roarSound && roarSound.isLoaded()) {
          roarSound.stop();
          roarSound.setVolume(0.9);
          roarSound.play();
          updateLog('OK GESTURE: PLAYING ROAR.MP3');
        } else {
          updateLog('OK GESTURE DETECTED - ROAR.MP3 NOT READY');
          playTone(220);
        }
      }

      // ===== 判斷伸出幾根手指 =====
      function updateFingerCountTrigger(activeHands) {
        detectedFingerCount = countTotalExtendedFingers(activeHands);

        if (detectedFingerCount === countCandidate) {
          countStableFrames++;
        } else {
          countCandidate = detectedFingerCount;
          countStableFrames = 0;
        }

        let isStable = countStableFrames > COUNT_STABLE_FRAMES;
        let inRange = detectedFingerCount >= 1 && detectedFingerCount <= MAX_FINGER_COUNT;
        let cooledDown = frameCount - lastSongTriggerFrame > SONG_TRIGGER_COOLDOWN_FRAMES;

        if (isStable && inRange && cooledDown && detectedFingerCount !== lastTriggeredCount) {
          startSongByFingerCount(detectedFingerCount);
          lastTriggeredCount = detectedFingerCount;
          lastSongTriggerFrame = frameCount;
        }

        // 手勢回到 0，才允許同一個數字再次觸發
        if (detectedFingerCount === 0 && isStable) {
          lastTriggeredCount = 0;
        }
      }

      function countTotalExtendedFingers(activeHands) {
        let total = 0;

        for (let i = 0; i < activeHands.length; i++) {
          total += countExtendedFingers(activeHands[i]);
        }

        return constrain(total, 0, MAX_FINGER_COUNT);
      }

      function countExtendedFingers(hand) {
        let count = 0;
        let kp = hand.keypoints;
        let palm = kp[9];

        // 拇指：用拇指尖到掌心的距離，判斷是否張開
        let thumbTip = kp[4];
        let thumbIp = kp[3];
        let thumbOpen = dist(thumbTip.x, thumbTip.y, palm.x, palm.y) > dist(thumbIp.x, thumbIp.y, palm.x, palm.y) + 18;
        if (thumbOpen) count++;

        // 其餘四指：指尖比 PIP 關節更高，視為伸出
        if (kp[8].y < kp[6].y - 10) count++;   // 食指
        if (kp[12].y < kp[10].y - 10) count++; // 中指
        if (kp[16].y < kp[14].y - 10) count++; // 無名指
        if (kp[20].y < kp[18].y - 10) count++; // 小指

        return constrain(count, 0, 5);
      }

      function startSongByFingerCount(count) {
        let song = fingerSongMap[count];
        if (!song) return;

        stopScheduledSong();

        currentSongNumber = count;
        currentSongTitle = song.title;
        currentSongColor = song.color;
        songPlayingFrames = 240;
        updateLog(`FINGER COUNT ${count}: PLAYING ${song.shortTitle}`);

        playSong(song);
      }

      function stopScheduledSong() {
        currentSongTimers.forEach(timer => clearTimeout(timer));
        currentSongTimers = [];

        if (roarSound && roarSound.isPlaying && roarSound.isPlaying()) {
          roarSound.stop();
        }
      }

      function playSong(song) {

        let melodyTotal = scheduleSequence(song.melody, song.instrument, 0, song.tempo, 1.0);

        if (song.bass) {
          scheduleSequence(song.bass, 'bass', 0, song.tempo, 0.72);
        }

        let endTimer = setTimeout(() => {
          if (currentSongTitle === song.title) {
            songPlayingFrames = 0;
            updateLog(`${song.shortTitle} COMPLETE`);
          }
        }, melodyTotal + 900);

        currentSongTimers.push(endTimer);
      }

      function scheduleSequence(sequence, instrument, startDelay, tempo, volumeScale) {
        let currentTime = startDelay;

        sequence.forEach(step => {
          let delay = currentTime;
          let dur = step.d * tempo;

          let timer = setTimeout(() => {
            if (step.n && step.n !== 'R') {
              playInstrumentNote(NOTES[step.n], dur, instrument, volumeScale);
            }

            if (step.chord) {
              playChord(step.chord, dur, instrument, volumeScale);
            }
          }, delay);

          currentSongTimers.push(timer);
          currentTime += dur;
        });

        return currentTime;
      }

      function playInstrumentNote(freq, dur, instrument, volumeScale = 1) {
        if (!freq) return;

        if (instrument === 'piano') {
          playPianoNote(freq, dur, volumeScale);
        } else if (instrument === 'violin') {
          playViolinNote(freq, dur, volumeScale);
        } else if (instrument === 'harpsichord') {
          playHarpsichordNote(freq, dur, volumeScale);
        } else if (instrument === 'strings') {
          playStringNote(freq, dur, volumeScale);
        } else if (instrument === 'pad') {
          playPadNote(freq, dur, volumeScale);
        } else if (instrument === 'babySynth') {
          playBabySynthNote(freq, dur, volumeScale);
        } else if (instrument === 'bass') {
          playBassNote(freq, dur, volumeScale);
        }
      }

      function playChord(noteNames, dur, instrument, volumeScale = 1) {
        noteNames.forEach((name, i) => {
          setTimeout(() => playInstrumentNote(NOTES[name], dur, instrument, volumeScale * 0.75), i * 24);
        });
      }

      function playPianoNote(freq, dur, volumeScale = 1) {
        let env = new p5.Envelope();
        env.setADSR(0.001, 0.07, 0.22, 0.22);
        env.setRange(0.45 * volumeScale, 0);

        let s1 = new p5.Oscillator('triangle');
        let s2 = new p5.Oscillator('sine');
        s1.freq(freq);
        s2.freq(freq * 2.01);
        s1.start();
        s2.start();
        s2.amp(0.10 * volumeScale);
        env.play(s1);

        setTimeout(() => {
          s1.stop();
          s2.stop();
        }, dur + 650);
      }

      function playViolinNote(freq, dur, volumeScale = 1) {
        let env = new p5.Envelope();
        env.setADSR(0.12, 0.12, 0.38, 0.28);
        env.setRange(0.28 * volumeScale, 0);

        let s1 = new p5.Oscillator('sawtooth');
        let s2 = new p5.Oscillator('triangle');
        s1.freq(freq);
        s2.freq(freq * 2.005);
        s1.start();
        s2.start();
        s2.amp(0.055 * volumeScale);
        env.play(s1);

        setTimeout(() => {
          s1.stop();
          s2.stop();
        }, dur + 700);
      }

      function playHarpsichordNote(freq, dur, volumeScale = 1) {
        let env = new p5.Envelope();
        env.setADSR(0.001, 0.05, 0.12, 0.12);
        env.setRange(0.34 * volumeScale, 0);

        let s = new p5.Oscillator('square');
        s.freq(freq);
        s.start();
        env.play(s);

        setTimeout(() => s.stop(), dur + 350);
      }

      function playStringNote(freq, dur, volumeScale = 1) {
        let env = new p5.Envelope();
        env.setADSR(0.06, 0.12, 0.42, 0.35);
        env.setRange(0.32 * volumeScale, 0);

        let s1 = new p5.Oscillator('sawtooth');
        let s2 = new p5.Oscillator('sawtooth');
        s1.freq(freq);
        s2.freq(freq * 1.005);
        s1.start();
        s2.start();
        s2.amp(0.08 * volumeScale);
        env.play(s1);

        setTimeout(() => {
          s1.stop();
          s2.stop();
        }, dur + 650);
      }

      function playPadNote(freq, dur, volumeScale = 1) {
        let env = new p5.Envelope();
        env.setADSR(0.22, 0.25, 0.28, 0.75);
        env.setRange(0.25 * volumeScale, 0);

        let s1 = new p5.Oscillator('sine');
        let s2 = new p5.Oscillator('triangle');
        s1.freq(freq);
        s2.freq(freq * 1.5);
        s1.start();
        s2.start();
        s2.amp(0.08 * volumeScale);
        env.play(s1);

        setTimeout(() => {
          s1.stop();
          s2.stop();
        }, dur + 1200);
      }

      function playBabySynthNote(freq, dur, volumeScale = 1) {
        // Baby Shark 內建音色：明亮、可愛、像玩具琴的合成器聲
        let env = new p5.Envelope();
        env.setADSR(0.001, 0.06, 0.18, 0.18);
        env.setRange(0.48 * volumeScale, 0);

        let s1 = new p5.Oscillator('square');
        let s2 = new p5.Oscillator('triangle');
        s1.freq(freq);
        s2.freq(freq * 2.0);
        s1.start();
        s2.start();
        s2.amp(0.08 * volumeScale);
        env.play(s1);

        setTimeout(() => {
          s1.stop();
          s2.stop();
        }, dur + 420);
      }

      function playBassNote(freq, dur, volumeScale = 1) {
        let env = new p5.Envelope();
        env.setADSR(0.005, 0.06, 0.25, 0.16);
        env.setRange(0.42 * volumeScale, 0);

        let s = new p5.Oscillator('square');
        s.freq(freq);
        s.start();
        env.play(s);

        setTimeout(() => s.stop(), dur + 450);
      }

      function drawEnergyLink(h1, h2, k, gx, gy) {
        let p1x = map(h1.keypoints[9].x, 0, 640, 0, width) + gx;
        let p1y = map(h1.keypoints[9].y, 0, 480, 0, height) + gy;
        let p2x = map(h2.keypoints[9].x, 0, 640, 0, width) + gx;
        let p2y = map(h2.keypoints[9].y, 0, 480, 0, height) + gy;

        let linkColor = lerpColor(mainColor, color(255, 0, 0), k);
        strokeWeight(1 + k * 14);
        stroke(linkColor);
        beginShape();
        noFill();

        for (let t = 0; t <= 1; t += 0.05) {
          vertex(
            lerp(p1x, p2x, t) + random(-k * 20, k * 20),
            lerp(p1y, p2y, t) + random(-k * 20, k * 20)
          );
        }

        endShape();
        fill(255);
        noStroke();
        circle((p1x + p2x) / 2, (p1y + p2y) / 2, 15 + k * 30);
      }

      function drawHoloDial(hand, id, gx, gy) {
        let wrist = hand.keypoints[0], middle = hand.keypoints[9];
        let targetX = map(wrist.x, 0, 640, 0, width);
        let targetY = map(wrist.y, 0, 480, 0, height);
        let angle = atan2(middle.y - wrist.y, middle.x - wrist.x) + 90;

        smoothedAngle[id] = lerp(smoothedAngle[id] || 0, angle, 0.15); 
        smoothedPos[id].x = lerp(smoothedPos[id].x || targetX, targetX, 0.2);
        smoothedPos[id].y = lerp(smoothedPos[id].y || targetY, targetY, 0.2);

        if (abs(smoothedAngle[id] - lastTickAngle[id]) >= 15) {
          playTone(1600);
          lastTickAngle[id] = smoothedAngle[id];
        }
        
        push();
        translate(smoothedPos[id].x + gx, smoothedPos[id].y + gy);
        rotate(smoothedAngle[id]);
        noFill();
        stroke(mainColor);
        strokeWeight(2);
        arc(0, 0, 130, 130, -40, 220);

        for (let i = 0; i < 12; i++) {
          rotate(30);
          stroke(mainColor, 100);
          line(50, 0, 58, 0);
        }

        fill(255, 50, 80);
        noStroke();
        triangle(75, 0, 65, -5, 65, 5);
        pop();

        fill(255);
        textAlign(CENTER);
        textSize(24);
        text(`${int(smoothedAngle[id])}°`, smoothedPos[id].x + gx, smoothedPos[id].y + gy + 10);
      }

      function checkButtons(x, y) {
        buttons.forEach(btn => {
          let isInside = x > btn.x && x < btn.x + btn.w && y > btn.y && y < btn.y + btn.h;

          if (isInside && !btn.active) {
            btn.active = true;
            playTone(1000);

            if (btn.label === 'COLOR') {
              colorIdx = (colorIdx + 1) % colors.length;
              mainColor = color(colors[colorIdx]);
            } else if (btn.label === 'GLITCH') {
              glitchTimer = 25;
              playTone(150);
            }
          } else if (!isInside) {
            btn.active = false;
          }
        });
      }

      function drawSciFiSkeleton(hand, gx, gy) {
        stroke(red(mainColor), green(mainColor), blue(mainColor), 80);
        let connections = handPose.getConnections();

        for (let i = 0; i < connections.length; i++) {
          let a = connections[i][0], b = connections[i][1];

          line(
            map(hand.keypoints[a].x, 0, 640, 0, width) + gx,
            map(hand.keypoints[a].y, 0, 480, 0, height) + gy,
            map(hand.keypoints[b].x, 0, 640, 0, width) + gx,
            map(hand.keypoints[b].y, 0, 480, 0, height) + gy
          );
        }
      }

      function drawFingertips(hand, gx, gy) {
        let tips = [
          { idx: 4, label: 'THUMB' },
          { idx: 8, label: 'INDEX' },
          { idx: 12, label: 'MIDDLE' },
          { idx: 16, label: 'RING' },
          { idx: 20, label: 'PINKY' }
        ];

        tips.forEach(item => {
          let k = hand.keypoints[item.idx];
          let x = map(k.x, 0, 640, 0, width) + gx;
          let y = map(k.y, 0, 480, 0, height) + gy;

          noFill();
          stroke(255, 180);
          circle(x, y, 14);

          fill(255, 150);
          noStroke();
          textSize(9);
          textAlign(LEFT, CENTER);
          text(item.label, x + 14, y - 8);
        });
      }

      function drawVirtualButtons(gx, gy) {
        buttons.forEach(btn => {
          push();
          translate(btn.x + gx / 3, btn.y + gy / 3);

          noFill();
          stroke(mainColor, 150);
          rect(0, 0, btn.w, btn.h, 2);

          if (btn.active) {
            fill(red(mainColor), green(mainColor), blue(mainColor), 80);
            rect(0, 0, btn.w, btn.h);
          }

          fill(btn.active ? 255 : mainColor);
          textAlign(CENTER, CENTER);
          textSize(11);
          text(btn.label, btn.w / 2, btn.h / 2);
          pop();
        });
      }

      function drawSongPanel() {
        let panelW = 900;
        let panelH = 92;
        let startX = width / 2 - panelW / 2;
        let startY = height - 112;
        let cellW = panelW / MAX_FINGER_COUNT;

        push();
        noFill();
        stroke(mainColor, 120);
        rect(startX, startY, panelW, panelH, 8);

        fill(255, 190);
        noStroke();
        textAlign(CENTER, CENTER);
        textSize(10);
        text('FINGER NUMBER MUSIC MODE: show 1 / 2 / 3 / 4 / 5 / 6 fingers and hold briefly to play a full phrase', width / 2, startY - 14);

        for (let i = 1; i <= MAX_FINGER_COUNT; i++) {
          let song = fingerSongMap[i];
          let x = startX + (i - 1) * cellW;
          let c = song.color;

          stroke(c[0], c[1], c[2], currentSongNumber === i && songPlayingFrames > 0 ? 255 : 140);
          fill(currentSongNumber === i && songPlayingFrames > 0 ? color(c[0], c[1], c[2], 70) : color(0, 0, 0, 0));
          rect(x + 6, startY + 8, cellW - 12, panelH - 16, 4);

          fill(c[0], c[1], c[2], 230);
          noStroke();
          textSize(22);
          text(i, x + cellW / 2, startY + 26);

          fill(255);
          textSize(9);
          text(song.shortTitle, x + cellW / 2, startY + 54);

          fill(255, 160);
          textSize(8);
          text(song.instrument.toUpperCase(), x + cellW / 2, startY + 72);
        }
        pop();
      }

      function drawFingerCountHUD() {
        push();
        translate(width - 180, 100);
        noFill();
        stroke(mainColor, 150);
        rect(0, 0, 140, 88, 4);

        fill(mainColor);
        noStroke();
        textAlign(CENTER, CENTER);
        textSize(10);
        text('DETECTED COUNT', 70, 18);

        fill(255);
        textSize(34);
        text(detectedFingerCount, 70, 52);

        fill(255, 160);
        textSize(8);
        text(`STABLE ${countStableFrames}/${COUNT_STABLE_FRAMES}`, 70, 75);
        pop();
      }

      function drawNowPlayingHUD() {
        if (songPlayingFrames <= 0) return;

        let c = currentSongColor;
        push();
        translate(width - 320, 40);
        noFill();
        stroke(c[0], c[1], c[2], 180);
        rect(0, 0, 280, 48, 4);

        fill(c[0], c[1], c[2], 70);
        rect(0, 0, 280, 48, 4);

        fill(255);
        noStroke();
        textAlign(CENTER, CENTER);
        textSize(10);
        text('NOW PLAYING', 140, 15);
        textSize(11);
        text(currentSongTitle, 140, 33);
        pop();
      }

      function drawOKGestureHUD() {
        push();
        translate(40, 230);
        noFill();
        stroke(okGestureDetected ? color(255, 120, 80) : color(0, 255, 255, 100));
        rect(0, 0, 160, 58, 4);

        fill(okGestureDetected ? color(255, 120, 80, 90) : color(0, 255, 255, 30));
        rect(0, 0, 160, 58, 4);

        fill(255);
        noStroke();
        textAlign(CENTER, CENTER);
        textSize(10);
        text('O / OK GESTURE', 80, 18);

        fill(okGestureDetected ? color(255, 255, 255) : color(255, 170));
        textSize(9);
        text(`ROAR MP3 ${okGestureStableFrames}/${OK_GESTURE_STABLE_FRAMES}`, 80, 40);
        pop();
      }

      function drawCursor(tx, ty) {
        fill(255);
        circle(tx, ty, 6);

        noFill();
        stroke(mainColor);
        circle(tx, ty, 20 + sin(frameCount * 10) * 5);
      }

      function drawScanningUI() {
        stroke(mainColor, 60);
        line(0, (frameCount * 4) % height, width, (frameCount * 4) % height);
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
      }
    </script>
  </body>
