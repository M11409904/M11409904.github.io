<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Fi Hand Tracking - Mozart Finger Music</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/addons/p5.sound.min.js"></script>
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0a0f19;
        overflow: hidden;
        font-family: 'Courier New', monospace;
      }
      
      .nav-group {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 2000;
        display: flex;
        gap: 10px;
      }
      
      .nav-btn { 
        padding: 10px 15px;
        font-size: 0.75em;
        border-radius: 4px; 
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 2px;
        transition: all 0.3s;
        cursor: pointer;
      }
      
      #back-btn {
        background: rgba(0, 255, 255, 0.05);
        border: 1px solid rgba(0, 255, 255, 0.2);
        color: #0ff;
      }

      #reload-btn {
        background: rgba(255, 50, 50, 0.05);
        border: 1px solid rgba(255, 50, 50, 0.3);
        color: #f33;
      }
      
      .nav-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        box-shadow: 0 0 10px currentColor;
      }

      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0a0f19;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        color: #0ff;
      }

      .start-btn {
        background: transparent;
        border: 1px solid #0ff;
        color: #0ff;
        padding: 12px 35px;
        font-size: 1.1em;
        cursor: pointer;
        margin-top: 20px;
        letter-spacing: 4px;
      }

      #status-log {
        position: fixed;
        bottom: 10px;
        left: 10px;
        color: rgba(0, 255, 255, 0.4);
        font-size: 10px;
        z-index: 2000;
      }
    </style>
  </head>

  <body>
    <div class="nav-group">
      <a href="../perception_demo.html" id="back-btn" class="nav-btn">HUB</a>
      <div id="reload-btn" class="nav-btn" onclick="location.reload()">RELOAD SYSTEM</div>
    </div>
    
    <div id="status-log">SYSTEM IDLE</div>

    <div id="overlay">
      <div style="letter-spacing: 8px; font-size: 1.5em;">CORE_STABILIZER_V3</div>
      <div id="loading-msg" style="margin-top:10px; font-size: 12px; color: rgba(0,255,255,0.6);">LOADING AI ENGINE...</div>
      <button id="init-btn" class="start-btn" onclick="initSystem()" style="display:none;">ACTIVATE_LINK</button>
    </div>

    <script>
      let video, handPose, hands = [];
      let isReady = false;
      let smoothedAngle = [0, 0], lastTickAngle = [0, 0], smoothedPos = [{x:0, y:0}, {x:0, y:0}];
      let mainColor, colors = ['#00ffff', '#ff00ff', '#ffff00'], colorIdx = 0;
      let glitchTimer = 0, osc, envelope, linkOsc;
      let modelCheckTimer = 0;

      // ===== 五指觸發一段樂曲 =====
      // 說明：這是用 p5.sound 合成器做的「莫札特 K.545 風格簡化鋼琴樂句」，不是錄音檔。
      // 食指會觸發最像鋼琴主旋律的一段，其它手指可觸發變奏、低音、和弦與鐘琴版本。
      const NOTES = {
        C2: 65.41, D2: 73.42, E2: 82.41, F2: 87.31, G2: 98.00, A2: 110.00, B2: 123.47,
        C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.00, A3: 220.00, B3: 246.94,
        C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
        C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00, B5: 987.77,
        C6: 1046.50, D6: 1174.66, E6: 1318.51, F6: 1396.91, G6: 1567.98
      };

      const MOZART_K545_PIANO = [
        { n: 'C5', d: 180 }, { n: 'E5', d: 180 }, { n: 'G5', d: 180 }, { n: 'C6', d: 260 },
        { n: 'B5', d: 180 }, { n: 'G5', d: 180 }, { n: 'E5', d: 180 }, { n: 'C5', d: 260 },
        { n: 'D5', d: 180 }, { n: 'F5', d: 180 }, { n: 'A5', d: 180 }, { n: 'D6', d: 260 },
        { n: 'C6', d: 180 }, { n: 'A5', d: 180 }, { n: 'F5', d: 180 }, { n: 'D5', d: 260 },
        { n: 'G4', d: 180 }, { n: 'B4', d: 180 }, { n: 'D5', d: 180 }, { n: 'G5', d: 260 },
        { n: 'E5', d: 180 }, { n: 'G5', d: 180 }, { n: 'C6', d: 180 }, { n: 'E6', d: 420 }
      ];

      const MOZART_VARIATION = [
        { n: 'E5', d: 140 }, { n: 'G5', d: 140 }, { n: 'C6', d: 220 }, { n: 'G5', d: 140 },
        { n: 'F5', d: 140 }, { n: 'A5', d: 140 }, { n: 'D6', d: 220 }, { n: 'A5', d: 140 },
        { n: 'G5', d: 140 }, { n: 'B5', d: 140 }, { n: 'D6', d: 220 }, { n: 'B5', d: 140 },
        { n: 'C6', d: 180 }, { n: 'G5', d: 180 }, { n: 'E5', d: 180 }, { n: 'C5', d: 360 }
      ];

      const MOZART_BASS = [
        { n: 'C3', d: 320 }, { n: 'G3', d: 320 }, { n: 'C3', d: 320 }, { n: 'G3', d: 320 },
        { n: 'D3', d: 320 }, { n: 'A3', d: 320 }, { n: 'D3', d: 320 }, { n: 'A3', d: 320 },
        { n: 'G2', d: 320 }, { n: 'D3', d: 320 }, { n: 'G2', d: 320 }, { n: 'D3', d: 320 },
        { n: 'C3', d: 640 }
      ];

      const MOZART_CHORDS = [
        { chord: ['C4', 'E4', 'G4'], d: 700 },
        { chord: ['D4', 'F4', 'A4'], d: 700 },
        { chord: ['G3', 'B3', 'D4'], d: 700 },
        { chord: ['C4', 'E4', 'G4', 'C5'], d: 900 }
      ];

      const fingerInstruments = [
        { idx: 4,  finger: 'THUMB',  instrument: 'VIOLIN PHRASE', mode: 'violin', phrase: MOZART_VARIATION, color: [255, 90, 140] },
        { idx: 8,  finger: 'INDEX',  instrument: 'MOZART PIANO',  mode: 'piano',  phrase: MOZART_K545_PIANO, color: [120, 220, 255] },
        { idx: 12, finger: 'MIDDLE', instrument: 'BELL MELODY',   mode: 'bell',   phrase: MOZART_K545_PIANO, color: [255, 255, 140] },
        { idx: 16, finger: 'RING',   instrument: 'BASS LINE',     mode: 'bass',   phrase: MOZART_BASS, color: [150, 255, 160] },
        { idx: 20, finger: 'PINKY',  instrument: 'PIANO CHORDS',  mode: 'chord',  phrase: MOZART_CHORDS, color: [220, 160, 255] }
      ];

      let lastFingerY = {};
      let lastFingerTriggerFrame = {};
      let activeFingerFX = [];
      let musicActiveFrames = 0;
      let currentMusicLabel = '';

      // 觸發設定：數字越小越敏感，越大越不容易誤觸
      const FINGER_TAP_SPEED = 22;
      const PHRASE_COOLDOWN_FRAMES = 90;

      let buttons = [
        { label: 'COLOR', x: 40, y: 120, w: 90, h: 40, active: false },
        { label: 'GLITCH', x: 40, y: 170, w: 90, h: 40, active: false }
      ];

      function setup() {
        createCanvas(windowWidth, windowHeight);
        mainColor = color(colors[colorIdx]);
        
        // 原本的短音效系統
        osc = new p5.Oscillator('sine');
        envelope = new p5.Envelope();
        envelope.setADSR(0.001, 0.05, 0.1, 0.1);
        envelope.setRange(0.5, 0);

        // 原本的雙手能量連線低頻音
        linkOsc = new p5.Oscillator('sawtooth');
        linkOsc.amp(0);
        
        handPose = ml5.handPose({ flipped: true, maxHands: 2 }, () => {
          document.getElementById('loading-msg').style.display = 'none';
          document.getElementById('init-btn').style.display = 'block';
          updateLog("MODEL ENGINE READY");
        });

        angleMode(DEGREES);
        textFont('Courier New');
      }

      function updateLog(msg) {
        document.getElementById('status-log').innerText = `LOG: ${msg}`;
      }

      function initSystem() {
        // 瀏覽器規定音效必須由使用者點擊後啟動
        userStartAudio();
        playBootSound();

        video = createCapture(VIDEO, () => {
          document.getElementById('overlay').style.display = 'none';
          startDetection();
        });

        video.size(640, 480);
        video.hide();
      }

      function startDetection() {
        isReady = true;
        updateLog("INITIALIZING DETECTOR...");

        handPose.detectStart(video, results => {
          hands = results;
          modelCheckTimer = 0;
        });
      }

      function playTone(freq) {
        osc.freq(freq);
        osc.start();
        envelope.play(osc);
      }

      function playBootSound() {
        let f = 300;
        let interval = setInterval(() => {
          playTone(f);
          f += 250;
          if (f > 1800) clearInterval(interval);
        }, 50);
      }

      // ===== 手指快速往下點一下：播放一整段樂句 =====
      function checkFingerInstrumentTriggers(hand, handId, gx, gy) {
        fingerInstruments.forEach(item => {
          let tip = hand.keypoints[item.idx];
          let x = map(tip.x, 0, 640, 0, width) + gx;
          let y = map(tip.y, 0, 480, 0, height) + gy;
          let key = `${handId}_${item.idx}`;

          if (lastFingerY[key] === undefined) {
            lastFingerY[key] = y;
            lastFingerTriggerFrame[key] = -999;
            return;
          }

          let dy = y - lastFingerY[key];
          let cooledDown = frameCount - lastFingerTriggerFrame[key] > PHRASE_COOLDOWN_FRAMES;

          if (dy > FINGER_TAP_SPEED && cooledDown) {
            triggerFingerPhrase(item, x, y);
            lastFingerTriggerFrame[key] = frameCount;
          }

          lastFingerY[key] = y;
        });
      }

      function triggerFingerPhrase(item, x, y) {
        musicActiveFrames = 180;
        currentMusicLabel = `${item.finger}: ${item.instrument}`;
        updateLog(`${item.finger} PLAYING ${item.instrument}`);

        playPhrase(item);

        activeFingerFX.push({
          x,
          y,
          label: item.instrument,
          color: item.color,
          life: 50,
          maxLife: 50
        });
      }

      function playPhrase(item) {
        let startTime = 0;

        item.phrase.forEach(step => {
          let delayTime = startTime;

          setTimeout(() => {
            if (step.n) {
              let freq = NOTES[step.n];
              if (item.mode === 'piano') playPianoNote(freq, step.d);
              else if (item.mode === 'violin') playViolinNote(freq, step.d);
              else if (item.mode === 'bell') playBellNote(freq, step.d);
              else if (item.mode === 'bass') playBassNote(freq, step.d);
            }

            if (step.chord) {
              playPianoChord(step.chord, step.d);
            }
          }, delayTime);

          startTime += step.d;
        });
      }

      function playPianoNote(freq, dur) {
        // 鋼琴感：短促、明亮、帶一點泛音
        let env = new p5.Envelope();
        env.setADSR(0.001, 0.08, 0.22, 0.25);
        env.setRange(0.48, 0);

        let s1 = new p5.Oscillator('triangle');
        let s2 = new p5.Oscillator('sine');
        s1.freq(freq);
        s2.freq(freq * 2.01);
        s1.start();
        s2.start();
        s2.amp(0.11);
        env.play(s1);

        setTimeout(() => {
          s1.stop();
          s2.stop();
        }, dur + 650);
      }

      function playPianoChord(noteNames, dur) {
        noteNames.forEach((name, i) => {
          setTimeout(() => playPianoNote(NOTES[name], dur), i * 28);
        });
      }

      function playViolinNote(freq, dur) {
        // 小提琴感：慢慢拉起來、有顫音 vibrato
        let carrier = new p5.Oscillator('sawtooth');
        let vibrato = new p5.Oscillator('sine');
        let env = new p5.Envelope();

        env.setADSR(0.12, 0.1, 0.38, 0.28);
        env.setRange(0.26, 0);

        carrier.freq(freq);
        vibrato.freq(5.6);
        vibrato.amp(8);
        vibrato.disconnect();
        carrier.freq(vibrato);

        carrier.start();
        vibrato.start();
        env.play(carrier);

        setTimeout(() => {
          carrier.stop();
          vibrato.stop();
        }, dur + 700);
      }

      function playBellNote(freq, dur) {
        // 鐘琴感：高音、尾音較長
        let env = new p5.Envelope();
        env.setADSR(0.001, 0.12, 0.18, 0.55);
        env.setRange(0.42, 0);

        let s1 = new p5.Oscillator('sine');
        let s2 = new p5.Oscillator('sine');
        s1.freq(freq * 1.5);
        s2.freq(freq * 2.42);
        s1.start();
        s2.start();
        s2.amp(0.14);
        env.play(s1);

        setTimeout(() => {
          s1.stop();
          s2.stop();
        }, dur + 900);
      }

      function playBassNote(freq, dur) {
        // 低音伴奏：低頻、短促、有衝擊
        let env = new p5.Envelope();
        env.setADSR(0.005, 0.06, 0.28, 0.18);
        env.setRange(0.55, 0);

        let s = new p5.Oscillator('square');
        s.freq(freq);
        s.start();
        env.play(s);

        setTimeout(() => {
          s.stop();
        }, dur + 400);
      }

      function draw() {
        background(10, 15, 25);
        if (!isReady) return;

        // 穩定性監控：如果 3 秒內沒有偵測到任何東西，嘗試重啟偵測
        modelCheckTimer++;
        if (modelCheckTimer > 180) { 
          updateLog("DETECTOR HANG DETECTED. RESTARTING...");
          startDetection();
          modelCheckTimer = 0;
        }

        let gx = (glitchTimer > 0) ? random(-15, 15) : 0;
        let gy = (glitchTimer > 0) ? random(-5, 5) : 0;
        if (glitchTimer > 0) glitchTimer--;

        push();
        translate(width + gx, gy);
        scale(-1, 1);
        tint(red(mainColor), green(mainColor), blue(mainColor), 50);
        image(video, 0, 0, width, height, 0, 0, video.width, video.height, COVER);
        pop();

        if (hands && hands.length > 0) {
          for (let i = 0; i < hands.length; i++) {
            let hand = hands[i];
            let indexTip = hand.keypoints[8];
            let tx = map(indexTip.x, 0, 640, 0, width);
            let ty = map(indexTip.y, 0, 480, 0, height);

            checkButtons(tx, ty);
            checkFingerInstrumentTriggers(hand, i, gx, gy);
            drawSciFiSkeleton(hand, gx, gy);
            drawFingertips(hand, gx, gy);
            drawHoloDial(hand, i, gx, gy);
            drawCursor(tx, ty);
          }

          if (hands.length === 2) {
            let d = dist(
              map(hands[0].keypoints[9].x, 0, 640, 0, width),
              map(hands[0].keypoints[9].y, 0, 480, 0, height),
              map(hands[1].keypoints[9].x, 0, 640, 0, width),
              map(hands[1].keypoints[9].y, 0, 480, 0, height)
            );

            let proximity = map(d, 100, 800, 1, 0, true);
            drawEnergyLink(hands[0], hands[1], proximity, gx, gy);
            linkOsc.amp(map(proximity, 0, 1, 0.05, 0.5), 0.1);
            linkOsc.freq(80 + proximity * 100);
            linkOsc.start();
          } else {
            linkOsc.amp(0, 0.5);
          }
        } else {
          linkOsc.amp(0, 0.5);
          drawScanningUI();
        }

        drawVirtualButtons(gx, gy);
        drawInstrumentPanel();
        drawFingerFX();
        drawMusicStatus();

        if (musicActiveFrames > 0) musicActiveFrames--;
      }

      function drawEnergyLink(h1, h2, k, gx, gy) {
        let p1x = map(h1.keypoints[9].x, 0, 640, 0, width) + gx;
        let p1y = map(h1.keypoints[9].y, 0, 480, 0, height) + gy;
        let p2x = map(h2.keypoints[9].x, 0, 640, 0, width) + gx;
        let p2y = map(h2.keypoints[9].y, 0, 480, 0, height) + gy;

        let linkColor = lerpColor(mainColor, color(255, 0, 0), k);
        strokeWeight(1 + k * 14);
        stroke(linkColor);
        beginShape();
        noFill();

        for (let t = 0; t <= 1; t += 0.05) {
          vertex(
            lerp(p1x, p2x, t) + random(-k * 20, k * 20),
            lerp(p1y, p2y, t) + random(-k * 20, k * 20)
          );
        }

        endShape();
        fill(255);
        noStroke();
        circle((p1x + p2x) / 2, (p1y + p2y) / 2, 15 + k * 30);
      }

      function drawHoloDial(hand, id, gx, gy) {
        let wrist = hand.keypoints[0], middle = hand.keypoints[9];
        let targetX = map(wrist.x, 0, 640, 0, width);
        let targetY = map(wrist.y, 0, 480, 0, height);
        let angle = atan2(middle.y - wrist.y, middle.x - wrist.x) + 90;

        smoothedAngle[id] = lerp(smoothedAngle[id] || 0, angle, 0.15); 
        smoothedPos[id].x = lerp(smoothedPos[id].x || targetX, targetX, 0.2);
        smoothedPos[id].y = lerp(smoothedPos[id].y || targetY, targetY, 0.2);

        if (abs(smoothedAngle[id] - lastTickAngle[id]) >= 15) {
          playTone(1600);
          lastTickAngle[id] = smoothedAngle[id];
        }
        
        push();
        translate(smoothedPos[id].x + gx, smoothedPos[id].y + gy);
        rotate(smoothedAngle[id]);
        noFill();
        stroke(mainColor);
        strokeWeight(2);
        arc(0, 0, 130, 130, -40, 220);

        for (let i = 0; i < 12; i++) {
          rotate(30);
          stroke(mainColor, 100);
          line(50, 0, 58, 0);
        }

        fill(255, 50, 80);
        noStroke();
        triangle(75, 0, 65, -5, 65, 5);
        pop();

        fill(255);
        textAlign(CENTER);
        textSize(24);
        text(`${int(smoothedAngle[id])}°`, smoothedPos[id].x + gx, smoothedPos[id].y + gy + 10);
      }

      function checkButtons(x, y) {
        buttons.forEach(btn => {
          let isInside = x > btn.x && x < btn.x + btn.w && y > btn.y && y < btn.y + btn.h;

          if (isInside && !btn.active) {
            btn.active = true;
            playTone(1000);

            if (btn.label === 'COLOR') {
              colorIdx = (colorIdx + 1) % colors.length;
              mainColor = color(colors[colorIdx]);
            } else if (btn.label === 'GLITCH') {
              glitchTimer = 25;
              playTone(150);
            }
          } else if (!isInside) {
            btn.active = false;
          }
        });
      }

      function drawSciFiSkeleton(hand, gx, gy) {
        stroke(red(mainColor), green(mainColor), blue(mainColor), 80);
        let connections = handPose.getConnections();

        for (let i = 0; i < connections.length; i++) {
          let a = connections[i][0], b = connections[i][1];

          line(
            map(hand.keypoints[a].x, 0, 640, 0, width) + gx,
            map(hand.keypoints[a].y, 0, 480, 0, height) + gy,
            map(hand.keypoints[b].x, 0, 640, 0, width) + gx,
            map(hand.keypoints[b].y, 0, 480, 0, height) + gy
          );
        }
      }

      function drawFingertips(hand, gx, gy) {
        fingerInstruments.forEach(item => {
          let k = hand.keypoints[item.idx];
          let x = map(k.x, 0, 640, 0, width) + gx;
          let y = map(k.y, 0, 480, 0, height) + gy;

          noFill();
          stroke(item.color[0], item.color[1], item.color[2], 210);
          circle(x, y, 16);

          fill(item.color[0], item.color[1], item.color[2], 210);
          noStroke();
          textSize(9);
          textAlign(LEFT, CENTER);
          text(`${item.instrument}`, x + 15, y - 10);
        });
      }

      function drawVirtualButtons(gx, gy) {
        buttons.forEach(btn => {
          push();
          translate(btn.x + gx / 3, btn.y + gy / 3);

          noFill();
          stroke(mainColor, 150);
          rect(0, 0, btn.w, btn.h, 2);

          if (btn.active) {
            fill(red(mainColor), green(mainColor), blue(mainColor), 80);
            rect(0, 0, btn.w, btn.h);
          }

          fill(btn.active ? 255 : mainColor);
          textAlign(CENTER, CENTER);
          textSize(11);
          text(btn.label, btn.w / 2, btn.h / 2);
          pop();
        });
      }

      function drawInstrumentPanel() {
        let panelW = 620;
        let panelH = 78;
        let startX = width / 2 - panelW / 2;
        let startY = height - 100;
        let cellW = panelW / fingerInstruments.length;

        push();
        noFill();
        stroke(mainColor, 120);
        rect(startX, startY, panelW, panelH, 8);

        fill(255, 180);
        noStroke();
        textAlign(CENTER, CENTER);
        textSize(10);
        text('MOZART PHRASE MODE: move one fingertip downward quickly to play a musical phrase', width / 2, startY - 14);

        fingerInstruments.forEach((item, i) => {
          let x = startX + i * cellW;
          let c = item.color;

          stroke(c[0], c[1], c[2], 170);
          noFill();
          rect(x + 6, startY + 8, cellW - 12, panelH - 16, 4);

          fill(c[0], c[1], c[2], 210);
          noStroke();
          textSize(11);
          text(item.finger, x + cellW / 2, startY + 28);

          fill(255);
          textSize(10);
          text(item.instrument, x + cellW / 2, startY + 52);
        });
        pop();
      }

      function drawFingerFX() {
        for (let i = activeFingerFX.length - 1; i >= 0; i--) {
          let fx = activeFingerFX[i];
          let k = fx.life / fx.maxLife;
          let c = fx.color;

          push();
          noFill();
          stroke(c[0], c[1], c[2], 255 * k);
          strokeWeight(2);
          circle(fx.x, fx.y, 20 + (1 - k) * 100);

          fill(c[0], c[1], c[2], 255 * k);
          noStroke();
          textAlign(CENTER, CENTER);
          textSize(13);
          text(fx.label, fx.x, fx.y - 32 - (1 - k) * 24);
          pop();

          fx.life--;
          if (fx.life <= 0) activeFingerFX.splice(i, 1);
        }
      }

      function drawMusicStatus() {
        if (musicActiveFrames <= 0) return;

        push();
        translate(width - 270, 40);
        noFill();
        stroke(0, 255, 255, 160);
        rect(0, 0, 230, 48, 4);

        fill(0, 255, 255, 70);
        rect(0, 0, 230, 48, 4);

        fill(255);
        noStroke();
        textAlign(CENTER, CENTER);
        textSize(10);
        text('PLAYING MOZART PHRASE', 115, 16);
        textSize(11);
        text(currentMusicLabel, 115, 33);
        pop();
      }

      function drawCursor(tx, ty) {
        fill(255);
        circle(tx, ty, 6);

        noFill();
        stroke(mainColor);
        circle(tx, ty, 20 + sin(frameCount * 10) * 5);
      }

      function drawScanningUI() {
        stroke(mainColor, 60);
        line(0, (frameCount * 4) % height, width, (frameCount * 4) % height);
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
      }
    </script>
  </body>
</html>
